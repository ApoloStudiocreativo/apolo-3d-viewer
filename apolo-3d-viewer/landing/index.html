<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
  />
  <title>Museo y Real Monasterio de San Joaquin y Santa Ana · Museo Virtual</title>
  <!-- Favicon estándar -->
<!-- Favicons -->
<link rel="icon" type="image/png" sizes="16x16" href="/assets/icons/favicon-16.png">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32.png">

<!-- Iconos para apps / PWA / Android -->
<link rel="icon" type="image/png" sizes="192x192" href="/assets/icons/app-icon-192.png">

<!-- iOS (pantalla de inicio) -->
<link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/app-icon-180.png">

  
    <!-- Para iOS (pantalla de inicio) -->
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/favicon.png" />

    <!-- PWA manifest (si lo tienes) -->
    <link rel="manifest" href="/manifest.json" />

  <meta name="theme-color" content="#0f1115" />
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600&display=swap" rel="stylesheet"/>

  <style>
    :root{
      --bg:#0f1115; --text:#e9eef7; --muted:#9aa4b2; --brand:#40cbcb;
      --card:#141720; --card-hover:#1a1f2a; --radius:16px;
    }
    html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;}
    .wrap{max-width:1100px;margin:0 auto;padding:18px 16px 28px;}
    header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:6px 0 16px;}
    .brand{display:flex;align-items:center;gap:10px;}
    .brand h1{font:600 18px/1 'Poppins',sans-serif;margin:0;letter-spacing:.2px}
    .brand small{color:var(--muted)}
    .search{position:relative;flex:1;max-width:340px;}
    .search input{
      width:100%; height:40px; border-radius:12px; border:1px solid #253042; background:#11151d;
      color:var(--text); padding:0 12px 0 36px; outline:none;
    }
    .search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:#6b7583}
    /* Grid: 2 columnas en móvil */
    .grid{
      display:grid; gap:14px;
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
    @media(min-width:560px){ .grid{ grid-template-columns: repeat(3, minmax(0, 1fr)); } }
    @media(min-width:920px){ .grid{ grid-template-columns: repeat(4, minmax(0, 1fr)); } }

    .card{
      display:block; text-decoration:none; color:inherit;
      background:var(--card); border:1px solid #1e2430; border-radius:var(--radius);
      overflow:hidden; transition:transform .12s ease, background .25s ease, border-color .25s ease, box-shadow .25s ease;
    }
    .card:hover{ transform:translateY(-2px); background:var(--card-hover); border-color:#2a3343; box-shadow:0 6px 18px rgba(0,0,0,.28); }
    .thumb{
      aspect-ratio: 4 / 3; width:100%; background:#0e1117 center/cover no-repeat;
    }
    .card .body{padding:10px 12px 12px;}
    .title{font:600 14px/1.25 'Poppins',sans-serif; margin:0 0 6px;}
    .sub{color:var(--muted); font-size:12px; margin:0;}
    .badge{
      position:absolute; top:8px; right:8px; font:700 10px/1 system-ui;
      background:rgba(64,203,203,.15); color:#aef; border:1px solid rgba(64,203,203,.35);
      padding:5px 8px; border-radius:999px; letter-spacing:.4px;
    }
    .thumb-wrap{position:relative;}

    /* Texto compacto en móviles muy estrechos */
    @media (max-width:380px){
      .title{ font-size:13px; }
      .sub{ font-size:11px; }
    }

    /* Bloqueo de zoom accidental SOLO en UI */
    header, .search, .grid, .card { touch-action: manipulation; }

.badge {
  font-size: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 0;
  width: 24px;
  height: 24px;
}

.badge svg {
  width: 14px;
  height: 14px;
  display: block;
  stroke: #66e0da; /* mismo color que el botón AR */
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
  fill: none;
}


/* (opcional) si quieres diferenciar SPLAT con otros colores */
.badge--splat svg {
  stroke: #8fe38f;              /* verde suave */
}
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand">
        <img class="brand-icon"
     src="/assets/icons/app-icon-48.png"
     srcset="/assets/icons/app-icon-48.png 1x, /assets/icons/app-icon-96.png 2x"
     width="28" height="28" alt="" decoding="async"
     style="border-radius:8px;object-fit:cover;" />

        <div>
          <h1>Museo San Joaquín Y Santa Ana</h1>
          <small>Museo Virtual</small>
        </div>
      </div>
      <label class="search" aria-label="Buscar piezas">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M21 21l-4.3-4.3M10.5 18a7.5 7.5 0 1 1 0-15 7.5 7.5 0 0 1 0 15z"
                stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <input id="q" type="search" placeholder="Buscar por título o autor…" autocomplete="off" />
      </label>
    </header>

    <main>
      <div id="grid" class="grid" aria-live="polite"></div>
    </main>
  </div>

  <script>
    // Datos mínimos (puedes generarlos desde tu info.json en el build si quieres)
    const DATA = [
  { slug:'cristo-yacente', title:'Cristo Yacente', subtitle:'Gregorio Fernández · s. XVII', type:'glb', poster:'/assets/posters/cristo-yacente.webp' },
  { slug:'virgen-romanica', title:'Virgen Románica', subtitle:'Talla policromada · s. XII', type:'glb', poster:'/assets/posters/virgen-romanica.webp' },
  { slug:'calvo-anillo', title:'Calvo – Anillo', subtitle:'SPLAT', type:'splat', poster:'/assets/posters/calvo-anillo.webp' },
  { slug:'bargueno-relicario', title:'Bargueño Relicario', subtitle:'—', type:'glb', poster:'/assets/posters/bargueno-relicario.webp' },
  { slug:'casulla-santa-ana', title:'Casulla Santa Ana', subtitle:'—', type:'glb', poster:'/assets/posters/casulla-santa-ana.webp' },
  { slug:'cristo-en-la-cruz', title:'Cristo en la Cruz', subtitle:'—', type:'glb', poster:'/assets/posters/cristo-en-la-cruz.webp' },
  { slug:'ecce-homo', title:'Ecce Homo', subtitle:'—', type:'glb', poster:'/assets/posters/ecce-homo.webp' },
  { slug:'jesus-atado-a-la-columna', title:'Jesús Atado a la Columna', subtitle:'—', type:'glb', poster:'/assets/posters/jesus-atado-a-la-columna.webp' },
  { slug:'novisimos', title:'Novísimos', subtitle:'—', type:'glb', poster:'/assets/posters/novisimos.webp' },
  { slug:'reliquia-dorada', title:'Reliquia Dorada', subtitle:'—', type:'glb', poster:'/assets/posters/reliquia-dorada.webp' },
  { slug:'san-bernardo-con-la-virgen', title:'San Bernardo con la Virgen', subtitle:'—', type:'glb', poster:'/assets/posters/san-bernardo-con-la-virgen.webp' },
  { slug:'san-jose-con-el-nino', title:'San José con el Niño', subtitle:'—', type:'glb', poster:'/assets/posters/san-jose-con-el-nino.webp' },
  { slug:'tapiz', title:'Tapiz', subtitle:'—', type:'glb', poster:'/assets/posters/tapiz.webp' },
  { slug:'virgen-asuncion', title:'Virgen de la Asunción', subtitle:'—', type:'glb', poster:'/assets/posters/virgen-asuncion.webp' },
  { slug:'virgen-de-mena', title:'Virgen de Mena', subtitle:'—', type:'glb', poster:'/assets/posters/virgen-de-mena.webp' }
];

    const grid = document.getElementById('grid');
    const q = document.getElementById('q');

    // Icono común (cubo AR)
const ICON_CUBE = `
  <svg viewBox="0 0 24 24" aria-hidden="true">
    <path
      d="M12 3l8.66 5v8L12 21l-8.66-5V8L12 3zM12 3v18M3.34 8L12 13l8.66-5"
      stroke="currentColor"
      stroke-width="1.8"
      stroke-linecap="round"
      stroke-linejoin="round"
      fill="none"
    />
  </svg>
`;

    // Iconos inline
    const ICONS = {
  glb: `
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M12 3l8.66 5v8L12 21l-8.66-5V8L12 3zM12 3v18M3.34 8L12 13l8.66-5"></path>
    </svg>
  `,
  splat: `
  <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M12 3l8.66 5v8L12 21l-8.66-5V8L12 3zM12 3v18M3.34 8L12 13l8.66-5"></path>
    </svg>
  `
};


    const toURL = (item) => item.type === 'splat' ? `/splat/${item.slug}` : `/${item.slug}`;
    const toCardHTML = (item) => `
      <a class="card" href="${toURL(item)}">
        <div class="thumb-wrap">
          <div class="thumb" style="background-image:url('${item.poster || '/models/placeholder.webp'}')"></div>
          <span class="badge" aria-label="${item.type.toUpperCase()}">
        ${ICON_CUBE}
        <span class="sr-only">${item.type.toUpperCase()}</span>
        </span>


        </div>
        <div class="body">
          <h3 class="title">${item.title || item.slug.replace(/-/g,' ')}</h3>
          <p class="sub">${item.subtitle || ''}</p>
        </div>
      </a>
    `;

    function render(){
      const term = q.value.trim().toLowerCase();
      const items = !term ? DATA : DATA.filter(x => {
        const hay = (x.title+' '+x.subtitle+' '+x.slug).toLowerCase();
        return hay.includes(term);
      });
      grid.innerHTML = items.map(toCardHTML).join('');
    }
    q.addEventListener('input', render);
    render();

    // Bloquear zoom accidental en UI (igual que en las figuras)
    (function preventZoomOnUI(){
      const uiRoots = ['header', '.search', '.grid'];
      const isInUI = (t)=> t?.closest && uiRoots.some(sel=> t.closest(sel));

      // iOS pinch zoom
      const onGesture = (e)=>{ if(isInUI(e.target)) e.preventDefault(); };
      document.addEventListener('gesturestart', onGesture, {passive:false, capture:true});
      document.addEventListener('gesturechange', onGesture, {passive:false, capture:true});

      // Ctrl+wheel (desktop)
      window.addEventListener('wheel', (e)=>{ if(e.ctrlKey && isInUI(e.target)) e.preventDefault(); }, {passive:false, capture:true});

      // Double-tap zoom (iOS)
      let lastTouchEnd = 0;
      document.addEventListener('touchend', (e)=>{
        if(!isInUI(e.target)) return;
        const now = Date.now();
        if(now - lastTouchEnd < 350) e.preventDefault();
        lastTouchEnd = now;
      }, {passive:false, capture:true});
    })();
  </script>
</body>
</html>
