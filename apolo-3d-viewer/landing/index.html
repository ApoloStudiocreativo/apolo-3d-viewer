<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Museo Virtual · Obras</title>
  <meta name="theme-color" content="#0f1115" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <style>
    :root{
      --bg:#0f1115; --card:#151922; --text:#e9eef7; --muted:#9aa4b2; --brand:#40cbcb;
      --radius:16px;
    }
    *{box-sizing:border-box}
    html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:500 15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,Arial}
    a{color:inherit;text-decoration:none}
    .wrap{max-width:1100px;margin:0 auto;padding:18px 14px 22px}
    header{display:flex;align-items:center;gap:12px;margin:8px 0 14px}
    h1{margin:0;font:800 clamp(18px,4.2vw,26px)/1.2 Poppins,system-ui}
    .tools{margin-left:auto;display:flex;gap:10px;flex-wrap:wrap}
    .search{display:flex;align-items:center;gap:8px;background:#0e1219;border:1px solid #222938;border-radius:12px;padding:8px 10px;min-width:220px}
    .search input{background:transparent;border:0;outline:0;color:var(--text);width:160px}
    .filter{display:flex;gap:6px}
    .chip{border:1px solid #2a3342;background:#131823;color:var(--muted);padding:6px 10px;border-radius:999px;cursor:pointer}
    .chip[aria-pressed="true"]{border-color:var(--brand);color:var(--text);background:rgba(64,203,203,.12)}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;margin-top:10px}
    .card{background:var(--card);border:1px solid #222938;border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column;transition:transform .12s ease, box-shadow .2s ease}
    .card:focus-within,.card:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(0,0,0,.35)}
    .thumb{aspect-ratio:1/1;background:#0b0f14;position:relative}
    .thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
    .meta{padding:10px 12px}
    .title{font-weight:700;font-size:14px;margin:0 0 4px}
    .sub{color:var(--muted);font-size:12px;margin:0}
    .badge{position:absolute;left:8px;top:8px;background:rgba(64,203,203,.16);color:#9fe9e9;border:1px solid rgba(64,203,203,.45);font:700 11px/1 system-ui;padding:6px 8px;border-radius:10px}
    .empty{color:var(--muted);text-align:center;padding:40px 0}
    .footer{margin:18px 0 4px;color:var(--muted);font-size:12px;text-align:center}
    @media (min-width:960px){.grid{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}}
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Obras del Museo</h1>
      <div class="tools">
        <label class="search" aria-label="Buscar">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M21 21l-4.3-4.3M10.5 18a7.5 7.5 0 1 1 0-15 7.5 7.5 0 0 1 0 15Z" stroke="#9aa4b2" stroke-width="1.8" stroke-linecap="round"/></svg>
          <input id="q" type="search" placeholder="Buscar obra o autor…" />
        </label>
        <div class="filter" role="group" aria-label="Filtrar por tipo">
          <button class="chip" data-type="all" aria-pressed="true">Todos</button>
          <button class="chip" data-type="glb">GLB</button>
          <button class="chip" data-type="splat">SPLAT</button>
        </div>
      </div>
    </header>

    <main>
      <div id="grid" class="grid" role="list"></div>
      <div id="empty" class="empty" hidden>Sin resultados.</div>
    </main>

    <p class="footer">Toca una tarjeta para abrir la pieza en 3D.</p>
  </div>

  <script>
    const grid = document.getElementById('grid');
    const empty = document.getElementById('empty');
    const q = document.getElementById('q');
    const chips = [...document.querySelectorAll('.chip')];

    let DATA = [];
    let filterType = 'all';
    let kw = '';

    function linkFor(slug, type){
      return type === 'splat' ? `/splat/${slug}` : `/${slug}`;
    }
    function card(slug, d){
      const title = d.title || slug.replace(/-/g,' ');
      const sub = [d.author, d.year].filter(Boolean).join(' · ');
      const poster = `/assets/posters/${slug}.webp`;
      const href = linkFor(slug, d.type === 'splat' ? 'splat' : 'glb');
      return `
        <article class="card" role="listitem">
          <a href="${href}" aria-label="${title}">
            <div class="thumb">
              <img src="${poster}" loading="lazy" alt="Póster de ${title}"
                   onerror="this.onerror=null;this.src='/models/placeholder.webp'">
              <span class="badge">${d.type==='splat'?'SPLAT':'GLB'}</span>
            </div>
            <div class="meta">
              <h3 class="title">${title}</h3>
              <p class="sub">${sub || '&nbsp;'}</p>
            </div>
          </a>
        </article>`;
    }
    function render(){
      const items = Object.entries(DATA)
        .filter(([slug, d]) => {
          if (filterType==='glb' && d.type==='splat') return false;
          if (filterType==='splat' && d.type!=='splat') return false;
          if (!kw) return true;
          const hay = `${slug} ${(d.title||'')} ${(d.author||'')} ${(d.year||'')}`.toLowerCase();
          return hay.includes(kw);
        });
      grid.innerHTML = items.map(([slug, d]) => card(slug, d)).join('');
      empty.hidden = items.length > 0;
    }
    async function boot(){
      try{
        const r = await fetch('/assets/info.json', {cache:'no-store'});
        const json = await r.json();
        DATA = json || {};
      }catch{ DATA = {}; }
      render();
    }
    boot();

    q.addEventListener('input', () => { kw = q.value.trim().toLowerCase(); render(); });
    chips.forEach(btn => btn.addEventListener('click', () => {
      chips.forEach(c => c.setAttribute('aria-pressed','false'));
      btn.setAttribute('aria-pressed','true');
      filterType = btn.dataset.type;
      render();
    }));
  </script>
</body>
</html>
