<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover" />
  <title>Visor Universal 3D + AR</title>

  <link rel="stylesheet" href="./index.css">

  <!-- model-viewer para modo GLB -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>

  <style>
    :root{
      --bg:#0f1115;
      --text:#e9eef7;
      --muted:#9aa4b2;
      --brand:#40cbcb;
      --shadow:0 10px 30px rgba(0,0,0,.35);
    }
    html,body{margin:0;height:100%;background:var(--bg);color:var(--text);overflow:hidden}
    .full{position:fixed;inset:0}
    .hidden{display:none!important}

    /* Contenedores de vista */
    model-viewer, iframe#splat {
      width:100vw; height:100dvh; display:block; background:var(--bg);
    }
    iframe#splat{border:0}

    /* Mensaje de error/ayuda */
    #msg{
      position:fixed; inset:0;
      display:flex; align-items:center; justify-content:center;
      font:500 16px/1.4 system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      text-align:center; color:var(--muted);
      padding:24px;
    }
    #msg b{color:#ff6464}

    /* Botón AR: visible solo en móvil/tablet */
    .ar-fab{
      position:fixed; left:50%; bottom: var(--fab-bottom); transform:translateX(-50%);
      display:none; /* por defecto oculto, se activa con media query */
      gap:10px; align-items:center; justify-content:center;
      height:56px; padding:0 18px; min-width:180px;
      border:none; border-radius:100px; cursor:pointer;
      background:var(--brand); color:white; font-weight:700; font-size:16px; letter-spacing:.2px;
      box-shadow:var(--shadow);
      z-index:20;
    }
    .ar-fab:active{transform:translateX(-50%) scale(.98)}
    .ar-fab svg{width:22px;height:22px}

    /* Solo móvil/tablet */
    @media (max-width:1024px){
      .ar-fab{display:flex}
    }

    /* Esqueleto simple mientras carga */
    .skeleton{
      position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
      background:linear-gradient(160deg,#101319 0%,#0b0e13 100%);
      color:#7b8696; font:500 14px system-ui, -apple-system, Segoe UI, Roboto, Arial;
    }
    .spinner{width:28px;height:28px;border-radius:50%;border:3px solid rgba(255,255,255,.15);border-top-color:#fff;animation:rot .9s linear infinite;margin-right:10px}
    @keyframes rot{to{transform:rotate(360deg)}}

    /* Audio global oculto */
    #global-audio{display:none}
  </style>
</head>
<body>

  <!-- Mensaje si faltan parámetros -->
  <div id="msg" class="hidden"></div>

  <!-- Capa skeleton mientras montamos la vista -->
  <div id="skel" class="skeleton"><div class="spinner"></div>Cargando…</div>

  <!-- Vista GLB -->
  <model-viewer id="mv" class="hidden"
    alt="Modelo 3D"
    camera-controls
    touch-action="pan-y"
    ar ar-modes="webxr scene-viewer quick-look"
    environment-image="neutral"
    shadow-intensity="1.2"
    shadow-softness="0.9"
    exposure="1"
    camera-orbit="0deg 70deg 1.5m"
    min-camera-orbit="auto auto 0.4m"
    max-camera-orbit="auto auto 6m"
    field-of-view="30deg">
  </model-viewer>

  <!-- Vista SPLAT -->
  <iframe id="splat" class="hidden" allow="xr; xr-spatial-tracking; gyroscope; accelerometer"></iframe>

  <!-- FAB AR unificado (solo móvil/tablet) -->
  <button id="arBtn" class="ar-fab hidden" type="button" aria-label="Ver en AR">
    <svg viewBox="0 0 24 24" fill="none"><path d="M12 3l8.66 5v8L12 21l-8.66-5V8L12 3zM12 3v18M3.34 8L12 13l8.66-5" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    Ver en AR
  </button>

  <!-- Audio global único -->
  <audio id="global-audio" preload="none" playsinline></audio>

  <script>
  (function(){
    const qs = new URLSearchParams(location.search);
    const type   = (qs.get('type')||'').toLowerCase();          // 'glb' | 'splat'
    const model  = (qs.get('model')||'').toLowerCase();         // para glb
    const figure = (qs.get('figure')||'').toLowerCase();        // para splat

    const mv    = document.getElementById('mv');
    const splat = document.getElementById('splat');
    const skel  = document.getElementById('skel');
    const msg   = document.getElementById('msg');
    const arBtn = document.getElementById('arBtn');
    const audioEl = document.getElementById('global-audio');

    // Helpers ruta según norma confirmada
    const glbUrl  = (name) => `/models/${name}/${name}.glb`;
    const usdzUrl = (name) => `/models/${name}/${name}.usdz`;
    const splatUrl= (name) => `/splat/${name}/index.html`;

    // Detectar plataforma
    const isIOS     = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    const isAndroid = /Android/.test(navigator.userAgent);

    // ----- Utilidades Audio -----

    // HEAD rápido para saber si existe el archivo
    async function fileExists(url){
      try { const r = await fetch(url, { method: 'HEAD' }); return r.ok; }
      catch { return false; }
    }

    // Espera un gesto de usuario para poder reproducir
    function waitUserGestureOnce(extraTargets = []){
      return new Promise(resolve => {
        const done = () => {
          window.removeEventListener('pointerdown', done);
          window.removeEventListener('keydown', done);
          window.removeEventListener('touchstart', done);
          extraTargets.forEach(t => {
            t?.removeEventListener?.('pointerdown', done);
            t?.removeEventListener?.('click', done);
            t?.removeEventListener?.('touchstart', done);
          });
          resolve();
        };
        window.addEventListener('pointerdown', done, { once:true, passive:true });
        window.addEventListener('keydown', done, { once:true });
        window.addEventListener('touchstart', done, { once:true, passive:true });
        extraTargets.forEach(t => {
          t?.addEventListener?.('pointerdown', done, { once:true, passive:true });
          t?.addEventListener?.('click', done, { once:true });
          t?.addEventListener?.('touchstart', done, { once:true, passive:true });
        });
      });
    }

    // Empuje extra de audio móvil (misma interacción)
function kickMobileAudioOnce(targets = []) {
  const el = document.getElementById('global-audio');
  if (!el) return;

  const handler = async () => {
    try {
      await el.play();
      const st = loadAudioState();
      saveAudioState({ ...st, playing: true });
    } catch {}
    targets.forEach(t => {
      t?.removeEventListener?.('click', handler);
      t?.removeEventListener?.('touchend', handler);
      t?.removeEventListener?.('pointerup', handler);
    });
  };

  targets.forEach(t => {
    t?.addEventListener?.('click', handler, { once: true });
    t?.addEventListener?.('touchend', handler, { once: true, passive: true });
    t?.addEventListener?.('pointerup', handler, { once: true, passive: true });
  });
}


    const AUDIO_KEY = "apolo.audio.state"; // { muted: bool, playing: bool }
    function loadAudioState(){
      try { return JSON.parse(localStorage.getItem(AUDIO_KEY)) || { muted:false, playing:false }; }
      catch { return { muted:false, playing:false }; }
    }
    function saveAudioState(next){
      try { localStorage.setItem(AUDIO_KEY, JSON.stringify(next)); } catch {}
    }

    // Carga audio para un slug con fallback a ambiente.mp3
    async function setupGlobalAudioForSlug(slug, unlockTargets = []){
      if (!audioEl) return;

      // Intenta por figura, si no existe cae a ambiente.mp3
      let src = null;
      const primary = slug ? `/assets/audio/${slug}.mp3` : null;
      if (primary && await fileExists(primary)) src = primary;
      else if (await fileExists('/assets/audio/ambiente.mp3')) src = '/assets/audio/ambiente.mp3';

      if (!src) {
        audioEl.removeAttribute('src');
        try { audioEl.pause(); } catch {}
        audioEl.load();
        return;
      }

      if (audioEl.getAttribute('src') !== src) {
        audioEl.setAttribute('src', src);
        try { audioEl.load(); } catch {}
      }

      // Restaura estado previo
      const state = loadAudioState();
      audioEl.muted = !!state.muted;

      // Reanuda si el usuario lo dejó en "playing"
      if (state.playing) {
        try { await waitUserGestureOnce(unlockTargets); await audioEl.play(); }
        catch { /* queda pausado hasta un gesto válido */ }
      } else {
        try { await audioEl.pause(); } catch {}
      }

      // Persistencia
      audioEl.onplay = () => saveAudioState({ ...loadAudioState(), playing:true });
      audioEl.onpause = () => saveAudioState({ ...loadAudioState(), playing:false });
      audioEl.onvolumechange = () => saveAudioState({ ...loadAudioState(), muted: audioEl.muted });
      audioEl.onerror = () => saveAudioState({ ...loadAudioState(), playing:false });
    }

    // AR launcher unificado
    function openARFor(name){
      const usdz = usdzUrl(name);
      const glb  = glbUrl(name);

      if(isIOS){
        window.location.href = usdz; // Quick Look
        return;
      }
      if(isAndroid){
        const file = new URL(glb, location.origin).toString();
        const intent = `intent://arvr.google.com/scene-viewer/1.0?file=${encodeURIComponent(file)}&mode=ar_preferred#Intent;scheme=https;package=com.google.ar.core;action=android.intent.action.VIEW;S.browser_fallback_url=${encodeURIComponent(location.href)};end;`;
        window.location.href = intent;
        return;
      }
      // Escritorio: botón oculto
    }

    // Mensaje de ayuda
    function showHelp(){
      skel.classList.add('hidden');
      msg.classList.remove('hidden');
      msg.innerHTML = `
        <div>
          <b>Falta parámetro en la URL.</b><br/><br/>
          Usa ejemplos:<br/>
          <code>?type=glb&model=cristo</code><br/>
          <code>?type=splat&figure=calvo-anillo</code>
        </div>
      `;
    }

    // Montaje según type
    (async function init(){
      try{
        if(type === 'glb' && model){
          // GLB view
          document.body.classList.remove('mode-splat');
          mv.src     = glbUrl(model);
          mv.iosSrc  = usdzUrl(model);
          mv.classList.remove('hidden');

          // Bloquear el botón AR por defecto de <model-viewer>
          if (!mv.querySelector('[slot="ar-button"]')) {
            const blocker = document.createElement('button');
            blocker.setAttribute('slot', 'ar-button');
            blocker.setAttribute('aria-hidden', 'true');
            blocker.style.display = 'none';
            blocker.tabIndex = -1;
            mv.appendChild(blocker);
          }

          // Audio global con fallback y desbloqueo por gesto en mv/arBtn
          await setupGlobalAudioForSlug(model, [mv, arBtn]);
          
          kickMobileAudioOnce([mv, arBtn, document.body]);

          // FAB AR
          arBtn.classList.remove('hidden');
          arBtn.onclick = () => {
            if (mv?.activateAR) {
              mv.activateAR().catch(()=> openARFor(model));
            } else {
              openARFor(model);
            }
          };
          skel.classList.add('hidden');
          return;
        }

        if(type === 'splat' && figure){
          // SPLAT view
          document.body.classList.add('mode-splat');
          splat.src = splatUrl(figure);
          splat.classList.remove('hidden');

          // Audio global con fallback y desbloqueo por gesto en iframe/arBtn
          await setupGlobalAudioForSlug(figure, [splat, arBtn]);

          kickMobileAudioOnce([splat, arBtn, document.body]);

          // FAB AR para la misma figura
          arBtn.classList.remove('hidden');
          arBtn.onclick = () => openARFor(figure);
          skel.classList.add('hidden');
          return;
        }

        // Si no coincide nada:
        showHelp();

      }catch(err){
        console.error(err);
        msg.classList.remove('hidden');
        msg.innerHTML = `<b>Error:</b> ${String(err).replace(/</g,'&lt;')}`;
        skel.classList.add('hidden');
      }
    })();
  })();
  </script>
</body>
</html>
