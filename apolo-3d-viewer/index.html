<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0f1115">
  <title>Museo Virtual San Joaquín y Santa Ana</title>

  <!-- Tipografía -->
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">

  <!-- CSS principal -->
  <link rel="preload" href="/index.css" as="style" fetchpriority="high">
  <link rel="stylesheet" href="/index.css">

  <!-- Datos/metadatos -->
  <link rel="preload" href="/assets/info.json" as="fetch" type="application/json" crossorigin="anonymous" fetchpriority="low">

  <!-- HDR / Skybox -->
  <link rel="preload" as="image" href="/assets/hdr/museo-suave.hdr" fetchpriority="low">
  <link rel="preload" as="image" href="/assets/hdr/museo-suave-blur.webp" fetchpriority="low">

  <!-- Posters -->
  <link rel="preload" as="image" href="/assets/posters/placeholder.webp" fetchpriority="high">
  <link rel="preload" as="image" href="/assets/posters/cristo-yacente.webp" fetchpriority="auto">

  <!-- Model Viewer -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js" defer></script>
</head>

<body>
  <!-- Topbar -->
  <header id="topBar" class="hidden">
    <h1 id="pieceTitle"></h1>
    <button id="infoBtn" class="info-btn" type="button" aria-label="Mostrar información">Información</button>
  </header>

  <!-- Mensaje si faltan parámetros -->
  <div id="msg" class="hidden"></div>

  <!-- Overlay skeleton -->
  <div id="skel" class="skeleton"><div class="spinner"></div>Cargando…</div>

  <!-- Vista GLB -->
  <model-viewer id="mv" class="hidden"
    poster="/assets/posters/placeholder.webp"
    alt="Modelo 3D"
    camera-controls
    touch-action="pan-y"
    ar
    ar-modes="scene-viewer quick-look webxr"
    ar-scale="fixed"
    ar-placement="floor"
    environment-image="neutral"
    shadow-intensity="1.2"
    shadow-softness="0.9"
    exposure="1"
    camera-orbit="0deg 70deg 1.5m"
    field-of-view="30deg">
  </model-viewer>

  <!-- Vista SPLAT -->
  <iframe
    id="splat"
    class="hidden"
    loading="lazy"
    allow="autoplay; fullscreen; xr-spatial-tracking; camera; microphone; gyroscope; accelerometer">
  </iframe>

  <!-- Poster temporal antes del SPLAT -->
  <div id="splatPoster" class="splat-poster hidden" aria-hidden="true"></div>

  <!-- FABs -->
  <div id="fabRow" class="fab-row">
    <button id="audioBtn" class="audio-fab hidden" type="button" aria-label="Reproducir audio" aria-pressed="false">
      <svg class="icon-play" viewBox="0 0 24 24" fill="none"><path d="M4 9v6h3l5 4V5L7 9H4z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M15 10.5a3.5 3.5 0 010 3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M17.5 8a6 6 0 010 8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <svg class="icon-pause" viewBox="0 0 24 24" fill="none"><rect x="6" y="5" width="4" height="14" rx="1.2" stroke="currentColor" stroke-width="1.8"/><rect x="14" y="5" width="4" height="14" rx="1.2" stroke="currentColor" stroke-width="1.8"/></svg>
    </button>

    <button id="arBtn" class="ar-fab hidden" type="button" aria-label="Ver en AR">
      <svg viewBox="0 0 24 24" fill="none"><path d="M12 3l8.66 5v8L12 21l-8.66-5V8L12 3zM12 3v18M3.34 8L12 13l8.66-5" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Ver en AR
    </button>
  </div>

  <!-- Overlay de carga AR -->
  <div id="arLoading" class="ar-loading hidden" aria-hidden="true">
    <div class="spinner" aria-hidden="true"></div>
    <span>Abriendo AR…</span>
  </div>

  <!-- Cartela -->
  <div id="infoSheet" class="info-sheet hidden" aria-hidden="true">
    <div class="info-sheet__drag"></div>
    <button id="infoClose" class="info-sheet__close" aria-label="Cerrar información">✕</button>
    <div class="info-sheet__content">
      <h2 id="infoTitle">Obra</h2>
      <p class="info-meta" id="infoMeta"></p>
      <p class="info-desc" id="infoDesc"></p>
    </div>
  </div>

  <!-- Link AR iOS oculto -->
  <a id="iosARLink" rel="ar" style="display:none" aria-hidden="true"></a>

  <!-- Script principal -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {

      // === OPTIMIZACIÓN DE CARGA ===
      document.documentElement.style.scrollBehavior = 'auto';
      if ('loading' in HTMLImageElement.prototype) {
        document.querySelectorAll('img').forEach(img => img.loading = 'lazy');
      }

      const qs = new URLSearchParams(location.search);
      let type = (qs.get('type') || '').toLowerCase();
      let model = (qs.get('model') || '').toLowerCase();
      let figure = (qs.get('figure') || '').toLowerCase();
      if (!type) {
        const parts = location.pathname.split('/').filter(Boolean);
        if (parts[0] === 'splat' && parts[1]) type = 'splat', figure = parts[1];
        else if (parts[0] === 'glb' && parts[1]) type = 'glb', model = parts[1];
        else if (parts.length === 1) type = 'glb', model = parts[0];
      }
      const slug = model || figure || '';

      const mv = document.getElementById('mv');
      const splat = document.getElementById('splat');
      const skel = document.getElementById('skel');
      const msg = document.getElementById('msg');
      const arBtn = document.getElementById('arBtn');
      const topBar = document.getElementById('topBar');
      const pieceTitle = document.getElementById('pieceTitle');
      const infoBtn = document.getElementById('infoBtn');
      const sheet = document.getElementById('infoSheet');
      const sheetClose = document.getElementById('infoClose');
      const infoTitle = document.getElementById('infoTitle');
      const infoMeta = document.getElementById('infoMeta');
      const infoDesc = document.getElementById('infoDesc');
      const audioBtn = document.getElementById('audioBtn');

      const glbUrl = n => `/models/${n}/${n}.glb`;
      const usdzUrl = n => `/models/${n}/${n}.usdz`;
      const splatUrl = n => `/splat/${n}/index.html`;

      async function exists(url){
        try{const r=await fetch(url,{method:'HEAD'});return r.ok}catch{return false}
      }

      const isIOS=/iPad|iPhone|iPod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
      const isAndroid=/Android/.test(navigator.userAgent);

      async function loadInfoDataOrFallback(current){
        try{
          const res=await fetch('/assets/info.json',{cache:'force-cache'});
          if(!res.ok)throw 0;
          return await res.json();
        }catch{return current;}
      }

      const infoData={
        "cristo-yacente":{title:"Cristo Yacente",meta:"s. XVII · Autor desconocido",desc:"Descripción pendiente."}
      };

      function showHelp(){
        skel.classList.add('hidden');
        msg.classList.remove('hidden');
        msg.innerHTML=`<b>Falta parámetro.</b><br>Ejemplo: ?type=glb&model=cristo-yacente`;
      }

      (async function init(){
        try{
          if(type==='glb'&&model){
            mv.src=glbUrl(model);
            const poster=`/assets/posters/${model}.webp`;
            if(await exists(poster)){
              mv.poster=poster;mv.setAttribute('poster',poster);
            }else{
              mv.poster='/assets/posters/placeholder.webp';
              mv.setAttribute('poster','/assets/posters/placeholder.webp');
            }

            mv.classList.remove('hidden');
            skel.classList.add('hidden');
            return;
          }
          if(type==='splat'&&figure){
            const splatPoster=document.getElementById('splatPoster');
            splatPoster.style.backgroundImage=`url('/assets/posters/placeholder.webp')`;
            splatPoster.classList.remove('hidden');
            requestAnimationFrame(()=>splatPoster.classList.add('visible'));
            (async()=>{
              const p=`/assets/posters/${figure}.webp`;
              if(await exists(p))splatPoster.style.backgroundImage=`url('${p}')`;
            })();
            splat.src=splatUrl(figure);
            splat.classList.remove('hidden');
            skel.classList.add('hidden');
            return;
          }
          showHelp();
        }catch(e){
          console.error(e);
          msg.textContent='Error al cargar.';
          msg.classList.remove('hidden');
          skel.classList.add('hidden');
        }
      })();
    });
  </script>
</body>
</html>
