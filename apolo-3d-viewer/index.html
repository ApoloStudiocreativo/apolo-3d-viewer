<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0f1115">
  <title>Museo Virtual San Joaquín y Santa Ana</title>

  <!-- Tipografía -->
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">

  <!-- CSS -->
  <link rel="preload" href="/index.css" as="style" fetchpriority="high">
  <link rel="stylesheet" href="/index.css">

  <!-- Model Viewer -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js" defer></script>
</head>

<body>
  <!-- Topbar -->
  <header id="topBar" class="hidden">
    <h1 id="pieceTitle"></h1>
    <button id="infoBtn" class="info-btn" type="button" aria-label="Mostrar información">Información</button>
  </header>

  <!-- Mensaje si faltan parámetros -->
  <div id="msg" class="hidden"></div>

  <!-- Skeleton -->
  <div id="skel" class="skeleton"><div class="spinner"></div>Cargando…</div>

  <!-- Vista GLB -->
  <model-viewer id="mv" class="hidden"
    poster="/assets/posters/placeholder.webp"
    alt="Modelo 3D"
    camera-controls
    touch-action="pan-y"
    ar
    ar-modes="scene-viewer quick-look webxr"
    ar-scale="fixed"
    ar-placement="floor"
    environment-image="neutral"
    shadow-intensity="1"
    shadow-softness="0.9"
    exposure="1.2">
  </model-viewer>

  <!-- Vista SPLAT -->
  <iframe id="splat" class="hidden" loading="lazy"
    allow="autoplay; fullscreen; xr-spatial-tracking; camera; microphone; gyroscope; accelerometer"></iframe>

  <!-- Poster SPLAT -->
  <div id="splatPoster" class="splat-poster hidden" aria-hidden="true"></div>

  <!-- Botones flotantes -->
  <div id="fabRow" class="fab-row">
    <button id="audioBtn" class="audio-fab hidden" type="button" aria-label="Reproducir audio">
      <svg class="icon-play" viewBox="0 0 24 24" fill="none">
        <path d="M4 9v6h3l5 4V5L7 9H4z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M15 10.5a3.5 3.5 0 010 3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        <path d="M17.5 8a6 6 0 010 8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
      <svg class="icon-pause" viewBox="0 0 24 24" fill="none">
        <rect x="6" y="5" width="4" height="14" rx="1.2" stroke="currentColor" stroke-width="1.8"/>
        <rect x="14" y="5" width="4" height="14" rx="1.2" stroke="currentColor" stroke-width="1.8"/>
      </svg>
    </button>

    <button id="arBtn" class="ar-fab hidden" type="button" aria-label="Ver en AR">
      <svg viewBox="0 0 24 24" fill="none">
        <path d="M12 3l8.66 5v8L12 21l-8.66-5V8L12 3zM12 3v18M3.34 8L12 13l8.66-5" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Ver en AR
    </button>
  </div>

  <!-- Overlay carga AR -->
  <div id="arLoading" class="ar-loading hidden" aria-hidden="true">
    <div class="spinner"></div><span>Abriendo AR…</span>
  </div>

  <!-- Cartela -->
  <div id="infoSheet" class="info-sheet hidden">
    <div class="info-sheet__drag"></div>
    <button id="infoClose" class="info-sheet__close" aria-label="Cerrar información">✕</button>
    <div class="info-sheet__content">
      <h2 id="infoTitle">Obra</h2>
      <p id="infoMeta" class="info-meta"></p>
      <p id="infoDesc" class="info-desc"></p>
    </div>
  </div>

  <!-- Script -->
  <script>
  document.addEventListener('DOMContentLoaded', () => {

    // --- Config inicial ---
    const qs = new URLSearchParams(location.search);
    let type = (qs.get('type') || '').toLowerCase();
    let model = (qs.get('model') || '').toLowerCase();
    let figure = (qs.get('figure') || '').toLowerCase();

    if (!type) {
      const parts = location.pathname.split('/').filter(Boolean);
      if (parts[0] === 'splat' && parts[1]) type = 'splat', figure = parts[1];
      else if (parts.length === 1) type = 'glb', model = parts[0];
    }
    const slug = model || figure || '';

    const mv = document.getElementById('mv');
    const splat = document.getElementById('splat');
    const skel = document.getElementById('skel');
    const topBar = document.getElementById('topBar');
    const infoBtn = document.getElementById('infoBtn');
    const infoSheet = document.getElementById('infoSheet');
    const infoClose = document.getElementById('infoClose');
    const infoTitle = document.getElementById('infoTitle');
    const infoMeta = document.getElementById('infoMeta');
    const infoDesc = document.getElementById('infoDesc');

    const glbUrl = n => `/models/${n}/${n}.glb`;
    const usdzUrl = n => `/models/${n}/${n}.usdz`;
    const splatUrl = n => `/splat/${n}/index.html`;

    async function exists(url){ try{const r=await fetch(url,{method:'HEAD'});return r.ok}catch{return false}}

    const infoData = {
      "cristo-yacente": { title: "Cristo Yacente", meta: "s. XVII · Autor desconocido", desc: "Escultura barroca de Cristo en reposo." },
      "virgen-romanica": { title: "Virgen Románica", meta: "s. XII · Madera policromada", desc: "Talla medieval de la Virgen con el Niño." }
    };

    // --- Cartela ---
    function renderInfo(slug){
      const d = infoData[slug] || {};
      infoTitle.textContent = d.title || slug.replace(/-/g,' ');
      infoMeta.textContent = d.meta || '';
      infoDesc.textContent = d.desc || 'Descripción pendiente.';
      topBar.classList.remove('hidden');
    }
    function openSheet(){ infoSheet.classList.remove('hidden'); }
    function closeSheet(){ infoSheet.classList.add('hidden'); }

    infoBtn.onclick = openSheet;
    infoClose.onclick = closeSheet;
    infoSheet.addEventListener('click', e => { if (e.target === infoSheet) closeSheet(); });

    // --- Inicialización ---
    (async()=>{
      try {
        if(type==='glb' && model){
          mv.src = glbUrl(model);

          const poster = `/assets/posters/${model}.webp`;
          mv.poster = (await exists(poster)) ? poster : '/assets/posters/placeholder.webp';

          renderInfo(model);
          mv.classList.remove('hidden');
          skel.classList.add('hidden');
          return;
        }

        if(type==='splat' && figure){
          const splatPoster = document.getElementById('splatPoster');
          splatPoster.style.backgroundImage = "url('/assets/posters/placeholder.webp')";
          splatPoster.classList.remove('hidden');
          requestAnimationFrame(()=>splatPoster.classList.add('visible'));
          (async()=>{
            const p = `/assets/posters/${figure}.webp`;
            if(await exists(p)) splatPoster.style.backgroundImage = `url('${p}')`;
          })();
          splat.src = splatUrl(figure);
          splat.classList.remove('hidden');
          skel.classList.add('hidden');
          renderInfo(figure);
          return;
        }

        // Fallback
        document.getElementById('msg').innerHTML = '<b>URL inválida</b>';
        document.getElementById('msg').classList.remove('hidden');
        skel.classList.add('hidden');
      } catch(e){
        console.error(e);
        skel.classList.add('hidden');
      }
    })();

  });
  </script>
</body>
</html>
