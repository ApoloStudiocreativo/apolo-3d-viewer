<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0f1115" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <title>Museo Virtual San Joaquín y Santa Ana</title>

    <!-- Preconnect (mejora de rendimiento fuentes) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Tipografía para títulos -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Poppins:wght=600&display=swap" rel="stylesheet"></noscript>
    <link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600;700&display=swap" rel="stylesheet"></noscript>


    <!-- CSS principal -->
    <link rel="stylesheet" href="/index.css" />

    <!-- Datos/metadatos -->
    <link
      rel="preload"
      href="/assets/info.json"
      as="fetch"
      type="application/json"
      crossorigin="anonymous"
    />

    <!-- HDR / skybox -->
    <link rel="preload" as="image" href="/assets/hdr/studio_small_09_2k.hdr" />
    <link rel="manifest" href="/manifest.webmanifest">

    <link rel="preconnect" href="https://ajax.googleapis.com" crossorigin>
  
    <!-- model-viewer (GLB) -->
    <script type="module" src="/vendor/model-viewer-4.0.0.min.js"></script>

    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch((e) =>
            console.debug('[sw] no registrado:', e?.message || e)
          );
        });
      }
    </script>
    
  </head>

  <body>
    <!-- =========================
         Topbar
         ========================= -->
         <header id="topBar">
          <!-- IZQUIERDA: Flecha + Isotipo -->
          <div class="left-group">
            <a class="back-btn" href="https://museovirtualsantana.es" aria-label="Volver atrás">
              <!-- Flecha minimalista -->
              <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="15 18 9 12 15 6"></polyline>
              </svg>
            </a>
        
            <!-- Isotipo (solo móvil) -->
            <img id="brandMark" src="/assets/brand/isotipo.svg" alt="Museo Virtual" />
        
            <!-- Logotipo completo (solo escritorio) -->
            <img id="brandLogo" src="/assets/brand/logo-museo.svg" alt="Museo Virtual San Joaquín y Santa Ana" />
          </div>
        
          <!-- CENTRO: Título de la obra -->
          <h1 id="pieceTitle">Cristo Yacente</h1>
        
          <!-- DERECHA: Botón Info (móvil) / Galería (escritorio) -->
          <button id="infoBtn" class="info-btn" type="button" aria-controls="infoSheet" aria-expanded="false">
            Información
          </button>          
          <a class="gallery-btn" href="https://museovirtualsantana.es" target="_blank" rel="noopener">Galería</a>
        </header>
        
        
        

<!-- Ayuda de atajos (desktop) -->
<div id="kbdHelp" class="kbd-help hidden" aria-hidden="true">
  <div class="kbd-help__row"><kbd>Arrastrar</kbd> Rotar</div>
  <div class="kbd-help__row"><kbd>Shift</kbd> + arrastrar — Pan</div>
  <div class="kbd-help__row"><kbd>Rueda</kbd> — Zoom</div>
  <div class="kbd-help__row"><kbd>H</kbd> — Mostrar/ocultar ayuda</div>
</div>



    <!-- Mensaje si faltan parámetros -->
    <div id="msg" class="hidden"></div>

    <!-- =========================
         Overlay skeleton (carga)
         ========================= -->
    <div id="skel" class="skeleton">
      <div class="loader-container">
        <div class="loader-circle">
          <div class="loader-progress" id="loaderProgress">0%</div>
        </div>
        <p class="loader-text">
          Cargando experiencia,<br />
          puede tardar un poco según tu conexión
        </p>
      </div>
    </div>

    <!-- =========================
         Vista GLB
         ========================= -->
    <model-viewer
      id="mv"
      class="hidden"
      poster="/models/placeholder.webp"
      alt="Modelo 3D"
      camera-controls
      touch-action="pan-y"
      ar
      ar-modes="scene-viewer quick-look webxr"
      ar-scale="fixed"
      ar-placement="floor"
      environment-image="neutral"
      shadow-intensity="1.2"
      shadow-softness="0.9"
      exposure="1"
      camera-orbit="0deg 70deg 1.5m"
      field-of-view="30deg"
    >
    </model-viewer>

    <!-- =========================
         Vista SPLAT
         ========================= -->
    <iframe
      id="splat"
      class="hidden"
      loading="lazy"
      allow="autoplay; fullscreen; xr-spatial-tracking; camera; microphone; gyroscope; accelerometer"
    >
    </iframe>

    <!-- Poster temporal antes del SPLAT -->
    <div id="splatPoster" class="splat-poster hidden" aria-hidden="true"></div>

    <!-- =========================
         FABs (Audio + AR)
         ========================= -->
    <div id="fabRow" class="fab-row">
      <!-- AUDIO (izquierda) -->
      <button
        id="audioBtn"
        class="audio-fab hidden"
        type="button"
        aria-label="Reproducir audio"
        aria-pressed="false"
      >
        <!-- Icono ALTAVOZ (parado) -->
        <svg class="icon-play" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path
            d="M4 9v6h3l5 4V5L7 9H4z"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <path
            d="M15 10.5a3.5 3.5 0 010 3"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
          />
          <path
            d="M17.5 8a6 6 0 010 8"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
          />
        </svg>
        <!-- Icono PAUSA (reproduciendo) -->
        <svg class="icon-pause" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <rect x="6" y="5" width="4" height="14" rx="1.2" stroke="currentColor" stroke-width="1.8" />
          <rect x="14" y="5" width="4" height="14" rx="1.2" stroke="currentColor" stroke-width="1.8" />
        </svg>
      </button>

      <!-- AR (derecha) -->
      <button id="arBtn" class="ar-fab hidden" type="button" aria-label="Ver en AR">
        <svg viewBox="0 0 24 24" fill="none">
          <path
            d="M12 3l8.66 5v8L12 21l-8.66-5V8L12 3zM12 3v18M3.34 8L12 13l8.66-5"
            stroke="white"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
        Ver en AR
      </button>
    </div>

    <!-- =========================
         Overlay de carga AR
         ========================= -->
    <div id="arLoading" class="ar-loading hidden" aria-hidden="true">
      <div class="spinner" aria-hidden="true"></div>
      <span>Abriendo AR…</span>
    </div>

    <!-- =========================
         Cartela (Info Sheet)
         ========================= -->
    <div id="infoSheet" class="info-sheet hidden" aria-hidden="true">
      <div class="info-sheet__drag"></div>
      <button id="infoClose" class="info-sheet__close" aria-label="Cerrar">✕</button>
    <div class="info-sheet__content">
      <h2 id="infoTitle">Obra</h2>
      <p class="info-meta" id="infoMeta"></p>
      <p class="info-desc" id="infoDesc"></p>

      <!-- Contenedor de CTAs (solo estructura) -->
      <div class="info-footer">
        <button id="audioGuideBtn" class="audio-cta" type="button" aria-pressed="false">
          <!-- iconos… -->
          Audioguía
        </button>
        <a class="visit-btn" href="https://museosanjoaquinysantaana.es/" target="_blank" rel="noopener">
          Visita la web
        </a>
      </div>
    </div>
    
    <!-- Link AR iOS oculto -->
    <a id="iosARLink" rel="ar" style="display:none" aria-hidden="true"></a>

<script src="./index.js"></script>
    
  </body>
</html>
