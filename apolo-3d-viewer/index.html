<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover" />
  <title>Museo Virtual San Joaquín y Santa Ana</title>

  <!-- Tipografías -->
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- CSS principal -->
  <link rel="stylesheet" href="/index.css">

  <!-- Datos/metadatos -->
  <link rel="preload" href="/assets/info.json" as="fetch" type="application/json" crossorigin="anonymous">

  <!-- HDR / skybox -->
  <link rel="preload" as="image" href="/assets/hdr/museo-suave.hdr">
  <link rel="preload" as="image" href="/assets/hdr/museo-suave-blur.webp">

  <!-- model-viewer (GLB) -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
</head>

<body>
  <!-- Topbar -->
  <header id="topBar" class="hidden">
    <h1 id="pieceTitle"></h1>
    <button id="infoBtn" class="info-btn" type="button" aria-label="Mostrar información">Información</button>
  </header>

  <!-- Mensaje si faltan parámetros -->
  <div id="msg" class="hidden"></div>

  <!-- Overlay skeleton inicial -->
  <div id="skel" class="skeleton"><div class="spinner"></div>Cargando…</div>

  <!-- Vista GLB -->
  <model-viewer id="mv" class="hidden"
    poster="/models/placeholder.webp"
    alt="Modelo 3D"
    camera-controls
    touch-action="pan-y"
    ar
    ar-modes="scene-viewer quick-look webxr"
    ar-scale="fixed"
    ar-placement="floor"
    environment-image="neutral"
    shadow-intensity="1.2"
    shadow-softness="0.9"
    exposure="1"
    camera-orbit="0deg 70deg 1.5m"
    field-of-view="30deg">
  </model-viewer>

  <!-- Vista SPLAT -->
  <iframe
    id="splat"
    class="hidden"
    loading="lazy"
    allow="autoplay; fullscreen; xr-spatial-tracking; camera; microphone; gyroscope; accelerometer">
  </iframe>

  <!-- Poster temporal antes del SPLAT -->
  <div id="splatPoster" class="splat-poster hidden" aria-hidden="true"></div>

  <!-- FABs -->
  <div id="fabRow" class="fab-row">
    <!-- AUDIO (izquierda) -->
    <button id="audioBtn" class="audio-fab hidden" type="button" aria-label="Reproducir audio" aria-pressed="false">
      <!-- Icono ALTAVOZ (parado) -->
      <svg class="icon-play" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M4 9v6h3l5 4V5L7 9H4z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M15 10.5a3.5 3.5 0 010 3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        <path d="M17.5 8a6 6 0 010 8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
      <!-- Icono PAUSA (reproduciendo) -->
      <svg class="icon-pause" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <rect x="6" y="5" width="4" height="14" rx="1.2" stroke="currentColor" stroke-width="1.8"/>
        <rect x="14" y="5" width="4" height="14" rx="1.2" stroke="currentColor" stroke-width="1.8"/>
      </svg>
    </button>

    <!-- AR (derecha) -->
    <button id="arBtn" class="ar-fab hidden" type="button" aria-label="Ver en AR">
      <svg viewBox="0 0 24 24" fill="none"><path d="M12 3l8.66 5v8L12 21l-8.66-5V8L12 3zM12 3v18M3.34 8L12 13l8.66-5" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Ver en AR
    </button>
  </div>

  <!-- Overlay de carga AR -->
  <div id="arLoading" class="ar-loading hidden" aria-hidden="true">
    <div class="ar-card" role="status" aria-live="polite">
      <!-- Progreso circular -->
      <div class="ar-ring">
        <svg class="ar-ring__svg" viewBox="0 0 48 48" aria-hidden="true">
          <circle class="ar-ring__track" cx="24" cy="24" r="20"/>
          <circle class="ar-ring__arc"   cx="24" cy="24" r="20"/>
        </svg>
        <div class="ar-ring__pct" id="arPct">0%</div>
      </div>

      <!-- Textos -->
      <div class="ar-copy">
        <div class="ar-title">Cargando experiencia…</div>
        <div class="ar-sub">Puede tardar unos segundos según tu conexión.</div>
      </div>
    </div>
  </div>

  <!-- Cartela de información -->
  <div id="infoSheet" class="info-sheet hidden" aria-hidden="true">
    <div class="info-sheet__drag"></div>
    <button id="infoClose" class="info-sheet__close" aria-label="Cerrar">✕</button>
    <div class="info-sheet__content">
      <h2 id="infoTitle">Obra</h2>
      <p class="info-meta" id="infoMeta"></p>
      <p class="info-desc" id="infoDesc"></p>
    </div>
  </div>

  <!-- Link AR iOS oculto -->
  <a id="iosARLink" rel="ar" style="display:none" aria-hidden="true"></a>

  <!-- JS (tu lógica intacta) -->
  <script>
    /* ====== Variables y helpers para AR Loading con porcentaje ====== */
    const arLoadingEl = document.getElementById('arLoading');
    const arPctEl     = document.getElementById('arPct');
    let arAnimating = false, arDone = false, rafId = 0, circLen = 0, currentPct = 0;

    (function initARRing(){
      const arc = document.querySelector('.ar-ring__arc');
      if (!arc) return;
      const r = parseFloat(arc.getAttribute('r')) || 20;
      circLen = 2 * Math.PI * r;
      arc.style.strokeDasharray  = String(circLen);
      arc.style.strokeDashoffset = String(circLen);
    })();

    function setARProgress(p){
      currentPct = Math.max(0, Math.min(100, p|0));
      if (arPctEl) arPctEl.textContent = currentPct + '%';
      const arc = document.querySelector('.ar-ring__arc');
      if (arc && circLen){
        arc.style.strokeDashoffset = String(circLen * (1 - currentPct/100));
      }
    }
    function startFakeProgress(){
      cancelAnimationFrame(rafId);
      arAnimating = true; arDone = false; setARProgress(0);
      const t0 = performance.now(), maxWhileWaiting = 87;
      const tick = (t)=>{
        if (!arAnimating) return;
        const dt = (t - t0) / 1000;
        const target = Math.min(maxWhileWaiting, Math.round(100 * (1 - Math.exp(-1.6 * dt))));
        if (target > currentPct) setARProgress(target);
        rafId = requestAnimationFrame(tick);
      };
      rafId = requestAnimationFrame(tick);
    }
    function finishAndHide(){
      arAnimating = false; cancelAnimationFrame(rafId);
      const start = currentPct, dur = 220, t0 = performance.now();
      const step = (t)=>{
        const k = Math.min(1, (t - t0)/dur);
        setARProgress(Math.round(start + (100 - start)*k));
        if (k < 1) requestAnimationFrame(step);
        else {
          arLoadingEl.classList.remove('visible');
          setTimeout(()=> arLoadingEl.classList.add('hidden'), 200);
        }
      };
      requestAnimationFrame(step);
    }
    function showARLoading(){
      if (!arLoadingEl) return;
      arLoadingEl.classList.remove('hidden');
      requestAnimationFrame(()=> arLoadingEl.classList.add('visible'));
      startFakeProgress();
    }
    function hideARLoading(){
      if (!arLoadingEl || arDone) return;
      arDone = true; finishAndHide();
    }
    document.addEventListener('visibilitychange', ()=>{ if (!document.hidden) hideARLoading(); });
  </script>

  <!-- Tu script principal (sin cambios funcionales) -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // ---------- URL parsing (query y pathname limpias) ----------
      const qs = new URLSearchParams(location.search);
      let type   = (qs.get('type')   || '').toLowerCase();
      let model  = (qs.get('model')  || '').toLowerCase();
      let figure = (qs.get('figure') || '').toLowerCase();
    
      if (!type) {
        const parts = location.pathname.split('/').filter(Boolean);
        if (parts[0] === 'splat' && parts[1]) { type = 'splat'; figure = parts[1]; }
        else if (parts[0] === 'glb' && parts[1]) { type = 'glb'; model = parts[1]; }
        else if (parts.length === 1) { type = 'glb'; model = parts[0]; }
      }
      const slug = model || figure || '';
    
      // ---------- DOM ----------
      const mv          = document.getElementById('mv');
      const splat       = document.getElementById('splat');
      const skel        = document.getElementById('skel');
      const msg         = document.getElementById('msg');
      const topBar      = document.getElementById('topBar');
      const pieceTitle  = document.getElementById('pieceTitle');
      const infoBtn     = document.getElementById('infoBtn');
      const sheet       = document.getElementById('infoSheet');
      const sheetClose  = document.getElementById('infoClose');
      const infoTitle   = document.getElementById('infoTitle');
      const infoMeta    = document.getElementById('infoMeta');
      const infoDesc    = document.getElementById('infoDesc');
      const audioBtn    = document.getElementById('audioBtn');
      const arBtn       = document.getElementById('arBtn');
      const splatPoster = document.getElementById('splatPoster');
    
      // ---------- Helpers ----------
      const glbUrl   = (name) => `/models/${name}/${name}.glb`;
      const usdzUrl  = (name) => `/models/${name}/${name}.usdz`;
      const splatUrl = (name) => `/splat/${name}/index.html`;
    
      async function exists(url){
        try{ const r = await fetch(url, { method:'HEAD', cache:'force-cache' }); return r.ok; }
        catch{ return false; }
      }
    
      const isIOS     = /iPad|iPhone|iPod/i.test(navigator.userAgent) ||
                        (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      const isAndroid = /Android/.test(navigator.userAgent);
    
      function buildMeta(d){
        if (!d) return '';
        if (d.author || d.year || d.material) {
          const parts = [];
          if (d.year) parts.push(d.year);
          if (d.author) parts.push(d.author);
          if (d.material) parts.push(d.material);
          return parts.filter(Boolean).join(' · ');
        }
        return d.meta || '';
      }
    
      // Info por defecto (se sobreescribe si existe info.json)
      let infoData = {
        "cristo-yacente":      { title:"Cristo Yacente", meta:"s. XVII · Autor/a desconocido/a", desc:"Descripción pendiente." },
        "virgen-romanica":     { title:"Virgen Románica", meta:"s. XII · Talla policromada", desc:"Descripción pendiente." },
        "san-jose-con-el-nino":{ title:"San José con el Niño", meta:"s. XVIII", desc:"Descripción pendiente." },
        "cristo-en-la-cruz":   { title:"Cristo en la Cruz", meta:"s. XVII", desc:"Descripción pendiente." }
      };
    
      async function loadInfoDataOrFallback(current){
        try{
          const res = await fetch('/assets/info.json', { cache:'no-store' });
          if (!res.ok) throw new Error('no info.json');
          const json = await res.json();
          return json || current;
        }catch{ return current; }
      }
    
      function renderInfo(s){
        const d = infoData[s] || {};
        const nice = (x) => (x||s||'').replace(/-/g,' ').trim();
    
        if (topBar){
          topBar.classList.remove('hidden');
          if (pieceTitle) pieceTitle.textContent = d.title || nice(s);
        }
        if (infoTitle) infoTitle.textContent = d.title || nice(s);
        if (infoMeta)  infoMeta.textContent  = buildMeta(d);
    
        const desc = d.desc || '';
        const extras = [];
        if (d.typology)   extras.push(`<div><strong>Tipología:</strong> ${d.typology}</div>`);
        if (d.material)   extras.push(`<div><strong>Material:</strong> ${d.material}</div>`);
        if (d.technique)  extras.push(`<div><strong>Técnica:</strong> ${d.technique}</div>`);
        if (d.dimensions) extras.push(`<div><strong>Dimensiones:</strong> ${d.dimensions}</div>`);
        if (d.year)       extras.push(`<div><strong>Fecha:</strong> ${d.year}</div>`);
        if (d.author)     extras.push(`<div><strong>Autor:</strong> ${d.author}</div>`);
        const extrasHtml = extras.length ? `<div class="info-extra">${extras.join('')}</div>` : '';
        if (infoDesc) infoDesc.innerHTML = [desc, extrasHtml].filter(Boolean).join('');
      }
    
      // ----- Cartela: asegura que haya 1 solo set de listeners -----
      if (infoBtn && sheet && !sheet.dataset.bound){
        infoBtn.addEventListener('click', ()=>{ renderInfo(slug); sheet.classList.remove('hidden'); sheet.setAttribute('aria-hidden','false'); });
        sheetClose?.addEventListener('click', ()=>{ sheet.classList.add('hidden'); sheet.setAttribute('aria-hidden','true'); });
        sheet.addEventListener('click', (e)=>{ if (e.target === sheet) { sheet.classList.add('hidden'); sheet.setAttribute('aria-hidden','true'); }});
        window.addEventListener('keydown', (e)=>{ if (e.key === 'Escape') { sheet.classList.add('hidden'); sheet.setAttribute('aria-hidden','true'); }});
        sheet.dataset.bound = '1';
      }
    
      // ----- Audio por figura -----
      let audio = null;
      function setupAudioFor(id){
        const url = `/assets/audio/${id}.mp3`;
        if (audio) { try { audio.pause(); } catch{} audio = null; }
    
        audio = new Audio(url);
        audio.loop = true;
        audio.preload = 'none';
    
        audioBtn?.classList.remove('hidden');
        audioBtn?.classList.remove('is-playing');
        audioBtn?.setAttribute('aria-pressed','false');
        audioBtn?.setAttribute('aria-label','Reproducir audio');
    
        audioBtn.onclick = async () => {
          if (!audio) return;
          if (audio.paused) {
            try {
              await audio.play();
              audioBtn.classList.add('is-playing');
              audioBtn.setAttribute('aria-pressed','true');
              audioBtn.setAttribute('aria-label','Pausar audio');
              if (navigator.vibrate) navigator.vibrate(10);
            } catch(e){ console.log('Bloqueo autoplay:', e); }
          } else {
            audio.pause();
            audioBtn.classList.remove('is-playing');
            audioBtn.setAttribute('aria-pressed','false');
            audioBtn.setAttribute('aria-label','Reproducir audio');
          }
        };
    
        document.addEventListener('visibilitychange', () => {
          if (document.hidden && audio && !audio.paused) {
            audio.pause();
            audioBtn.classList.remove('is-playing');
            audioBtn.setAttribute('aria-pressed','false');
            audioBtn.setAttribute('aria-label','Reproducir audio');
          }
        }, { once:true });
    
        audio.addEventListener('error', () => {
          console.warn('Audio no encontrado:', url);
        });
      }
    
      // ----- AR helpers (usa showARLoading/hideARLoading ya definidos arriba) -----
      function openARFor(name){
        const usdz = usdzUrl(name);
        const glb  = glbUrl(name);
        const arTitle = encodeURIComponent((infoTitle?.textContent || name).trim());
    
        if (isIOS) { window.location.href = usdz; return; }
        if (isAndroid){
          const file = new URL(glb, location.origin).toString();
          const intent = `intent://arvr.google.com/scene-viewer/1.0?file=${encodeURIComponent(file)}&mode=ar_preferred&title=${arTitle}#Intent;scheme=https;package=com.google.android.googlequicksearchbox;action=android.intent.action.VIEW;end;`;
          window.location.href = intent;
        }
      }
      function openQuickLookSync(slug) {
        try {
          const link = document.getElementById('iosARLink');
          if (!link) return false;
          link.setAttribute('href', `/models/${slug}/${slug}.usdz#${Date.now()}`);
          link.click();
          return true;
        } catch { return false; }
      }
    
      // ---------- INIT ----------
      (async function init(){
        try{
          // Cargar info.json si existe
          if (slug) infoData = await loadInfoDataOrFallback(infoData);
    
          // ----- SPLAT -----
          if (type === 'splat' && figure){
            document.body.classList.add('mode-splat');
    
            // Poster previo (fallback inmediato + intento específico)
            if (splatPoster){
              splatPoster.style.backgroundImage = `url('/models/placeholder.webp')`;
              splatPoster.classList.remove('hidden');
              requestAnimationFrame(()=> splatPoster.classList.add('visible'));
              (async ()=>{
                const posterUrl = `/assets/posters/${figure}.webp`;
                if (await exists(posterUrl)) splatPoster.style.backgroundImage = `url('${posterUrl}')`;
              })();
              splat.addEventListener('load', ()=>{
                splatPoster.classList.add('fade-out');
                setTimeout(()=> splatPoster.classList.add('hidden'), 700);
              }, { once:true });
            }
    
            // Cargar iframe SPLAT
            splat.src = splatUrl(figure);
            splat.classList.remove('hidden');
    
            // Título / cartela
            renderInfo(figure);
    
            // Audio
            setupAudioFor(figure);
    
            // Botón AR unificado con overlay
            arBtn.classList.remove('hidden');
            arBtn.onclick = () => {
              showARLoading();
              if (isIOS) {
                const ok = openQuickLookSync(figure);
                if (!ok) window.location.href = usdzUrl(figure);
                return;
              }
              openARFor(figure);
            };
    
            skel.classList.add('hidden');
            return;
          }
    
          // ----- GLB -----
          if (type === 'glb' && model){
            document.body.classList.remove('mode-splat');
    
            // Fuente GLB
            mv.src = glbUrl(model);
    
            // Poster por pieza con fallback
            try {
              const posterSrc = `/assets/posters/${model}.webp`;
              if (await exists(posterSrc)) {
                mv.poster = posterSrc; mv.setAttribute('poster', posterSrc);
              } else {
                mv.poster = '/models/placeholder.webp'; mv.setAttribute('poster','/models/placeholder.webp');
              }
            } catch {
              mv.poster = '/models/placeholder.webp'; mv.setAttribute('poster','/models/placeholder.webp');
            }
    
            // iOS Quick Look
            mv.iosSrc = usdzUrl(model);
            mv.classList.remove('hidden');
    
            // Oculta botón AR nativo
            if (!mv.querySelector('[slot="ar-button"]')) {
              const blocker = document.createElement('button');
              blocker.setAttribute('slot','ar-button');
              blocker.setAttribute('aria-hidden','true');
              blocker.style.display = 'none';
              blocker.tabIndex = -1;
              mv.appendChild(blocker);
            }
    
            // Título / cartela
            renderInfo(model);
    
            // Audio
            setupAudioFor(model);
    
            // Botón AR unificado
            arBtn.classList.remove('hidden');
            arBtn.onclick = () => {
              showARLoading();
              if (isIOS) {
                const ok = openQuickLookSync(model);
                if (!ok) window.location.href = usdzUrl(model);
                return;
              }
              if (mv?.activateAR) {
                mv.activateAR().catch(()=> openARFor(model));
              } else {
                openARFor(model);
              }
            };
    
            skel.classList.add('hidden');
            return;
          }
    
          // ----- Sin parámetros válidos -----
          skel.classList.add('hidden');
          msg.classList.remove('hidden');
          msg.innerHTML = `
            <div>
              <b>Falta parámetro en la URL.</b><br/><br/>
              Usa ejemplos:<br/>
              <code>?type=glb&model=cristo-yacente</code><br/>
              <code>?type=splat&figure=calvo-anillo</code>
            </div>`;
        }catch(err){
          console.error(err);
          msg.classList.remove('hidden');
          msg.innerHTML = `<b>Error:</b> ${String(err).replace(/</g,'&lt;')}`;
          skel.classList.add('hidden');
        }
      })();
    });
    </script>
    
</body>
</html>
