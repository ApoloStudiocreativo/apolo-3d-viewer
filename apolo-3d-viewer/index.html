<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover" />
<title>Museo Virtual San Joaquín y Santa Ana</title>

<!-- Tipografía para títulos -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600&display=swap" rel="stylesheet">


<link rel="stylesheet" href="./index.css">
<link rel="preload" href="/assets/info.json" as="fetch" type="application/json" crossorigin="anonymous">


<!-- model-viewer para modo GLB -->
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>

<style>
:root{
--bg:#0f1115;
--text:#e9eef7;
--muted:#9aa4b2;
--brand:#40cbcb;
--shadow:0 10px 30px rgba(0,0,0,.35);
--fab-bottom: max(18px, env(safe-area-inset-bottom));
}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);overflow:hidden}
.full{position:fixed;inset:0}
.hidden{display:none!important}

/* Contenedores de vista */
model-viewer, iframe#splat {
width:100vw; height:100dvh; display:block; background:var(--bg);
}
iframe#splat{border:0}

/* Mensaje de error/ayuda */
#msg{
position:fixed; inset:0;
display:flex; align-items:center; justify-content:center;
font:500 16px/1.4 system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
text-align:center; color:var(--muted);
padding:24px;
}
#msg b{color:#ff6464}

/* Botón AR: visible solo en móvil/tablet */
.ar-fab{
      position:fixed; left:50%; bottom:18px; transform:translateX(-50%);
      position:fixed; left:50%; bottom: var(--fab-bottom); transform:translateX(-50%);
display:none; /* por defecto oculto, se activa con media query */
gap:10px; align-items:center; justify-content:center;
height:56px; padding:0 18px; min-width:180px;
border:none; border-radius:16px; cursor:pointer;
background:var(--brand); color:white; font-weight:700; font-size:16px; letter-spacing:.2px;
box-shadow:var(--shadow);
z-index:20;
}
.ar-fab:active{transform:translateX(-50%) scale(.98)}
.ar-fab svg{width:22px;height:22px}

/* Solo móvil/tablet */
@media (max-width:1024px){
.ar-fab{display:flex}
}

/* Esqueleto simple mientras carga */
.skeleton{
position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
background:linear-gradient(160deg,#101319 0%,#0b0e13 100%);
color:#7b8696; font:500 14px system-ui, -apple-system, Segoe UI, Roboto, Arial;
}
.spinner{width:28px;height:28px;border-radius:50%;border:3px solid rgba(255,255,255,.15);border-top-color:#fff;animation:rot .9s linear infinite;margin-right:10px}
@keyframes rot{to{transform:rotate(360deg)}}
</style>
</head>
<body>

  <header id="topBar" class="hidden">

    <h1 id="pieceTitle"></h1>

    <button id="infoBtn" class="info-btn" type="button" aria-label="Mostrar información">
      Información
    </button>
    
  </header>
  

<!-- Mensaje si faltan parámetros -->
<div id="msg" class="hidden"></div>

<!-- Capa skeleton mientras montamos la vista -->
<div id="skel" class="skeleton"><div class="spinner"></div>Cargando…</div>

<!-- Vista GLB -->
<model-viewer id="mv" class="hidden"
poster="/models/placeholder.webp"
alt="Modelo 3D"
camera-controls
touch-action="pan-y"
ar ar-modes="scene-viewer quick-look webxr"
environment-image="neutral"
shadow-intensity="1.2"
shadow-softness="0.9"
exposure="1"
camera-orbit="0deg 70deg 1.5m"
min-camera-orbit="auto auto 0.4m"
max-camera-orbit="auto auto 6m"
field-of-view="30deg">
</model-viewer>

<!-- Vista SPLAT -->
<iframe
  id="splat"
  class="hidden"
  loading="lazy"
  allow="autoplay; fullscreen; xr-spatial-tracking; camera; microphone; gyroscope; accelerometer">
</iframe>


<!-- BARRA DE FABs -->
<div id="fabRow" class="fab-row">

  <!-- AUDIO (izquierda) -->
<button id="audioBtn" class="audio-fab hidden" type="button" aria-label="Reproducir audio" aria-pressed="false">
  <!-- Icono ALTAVOZ (estado: parado) -->
  <svg class="icon-play" viewBox="0 0 24 24" fill="none" aria-hidden="true">
    <path d="M4 9v6h3l5 4V5L7 9H4z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M15 10.5a3.5 3.5 0 010 3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M17.5 8a6 6 0 010 8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
  </svg>
  <!-- Icono PAUSA (estado: reproduciendo) -->
  <svg class="icon-pause" viewBox="0 0 24 24" fill="none" aria-hidden="true">
    <rect x="6" y="5" width="4" height="14" rx="1.2" stroke="currentColor" stroke-width="1.8"/>
    <rect x="14" y="5" width="4" height="14" rx="1.2" stroke="currentColor" stroke-width="1.8"/>
  </svg>
</button>


  <!-- AR (derecha) -->
  <button id="arBtn" class="ar-fab hidden" type="button" aria-label="Ver en AR">
    <svg viewBox="0 0 24 24" fill="none"><path d="M12 3l8.66 5v8L12 21l-8.66-5V8L12 3zM12 3v18M3.34 8L12 13l8.66-5" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    Ver en AR
  </button>
</div>

<!-- Panel/cartela de información del museo -->
<div id="infoSheet" class="info-sheet hidden" aria-hidden="true">
  <div class="info-sheet__drag"></div>
  <button id="infoClose" class="info-sheet__close" aria-label="Cerrar">✕</button>

  <div class="info-sheet__content">
    <h2 id="infoTitle">Obra</h2>
    <p class="info-meta" id="infoMeta"></p>
    <p class="info-desc" id="infoDesc"></p>
  </div>
</div>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    // ---------------- URL ----------------
    const qs     = new URLSearchParams(location.search);
    const type   = (qs.get('type')||'').toLowerCase();
    const model  = (qs.get('model')||'').toLowerCase();
    const figure = (qs.get('figure')||'').toLowerCase();
    const slug   = model || figure || '';
  
    // ---------------- Elementos del DOM ----------------
    const mv      = document.getElementById('mv');
    const splat   = document.getElementById('splat');
    const skel    = document.getElementById('skel');
    const msg     = document.getElementById('msg');
    const arBtn   = document.getElementById('arBtn');
    const topBar  = document.getElementById('topBar');
    const pieceTitle = document.getElementById('pieceTitle');
    const infoBtn = document.getElementById('infoBtn');
    const sheet   = document.getElementById('infoSheet');
    const sheetClose = document.getElementById('infoClose');
    const infoTitle  = document.getElementById('infoTitle');
    const infoMeta   = document.getElementById('infoMeta');
    const infoDesc   = document.getElementById('infoDesc');
    const audioBtn   = document.getElementById('audioBtn');
  
    // ---------------- Rutas ----------------
    const glbUrl   = (name) => `/models/${name}/${name}.glb`;
    const usdzUrl  = (name) => `/models/${name}/${name}.usdz`;
    const splatUrl = (name) => `/splat/${name}/index.html`;
  
    const isIOS     = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    const isAndroid = /Android/.test(navigator.userAgent);
  
    // ---------------- Audio por figura ----------------
    let audio = null;
    function setupAudioFor(id){
      const url = `/assets/audio/${id}.mp3`;
      if (audio) { try { audio.pause(); } catch{} audio = null; }
  
      audio = new Audio(url);
      audio.loop = true;
      audio.preload = 'none';
  
      audioBtn.classList.remove('hidden');
      audioBtn.classList.remove('is-playing');
      audioBtn.setAttribute('aria-pressed','false');
      audioBtn.setAttribute('aria-label','Reproducir audio');
  
      audioBtn.onclick = async () => {
        if (!audio) return;
        if (audio.paused) {
          try {
            await audio.play();
            audioBtn.classList.add('is-playing');
            audioBtn.setAttribute('aria-pressed','true');
            audioBtn.setAttribute('aria-label','Pausar audio');
            if (navigator.vibrate) navigator.vibrate(10);
          } catch(e){ console.log('Bloqueo autoplay:', e); }
        } else {
          audio.pause();
          audioBtn.classList.remove('is-playing');
          audioBtn.setAttribute('aria-pressed','false');
          audioBtn.setAttribute('aria-label','Reproducir audio');
        }
      };
  
      document.addEventListener('visibilitychange', () => {
        if (document.hidden && audio && !audio.paused) {
          audio.pause();
          audioBtn.classList.remove('is-playing');
          audioBtn.setAttribute('aria-pressed','false');
          audioBtn.setAttribute('aria-label','Reproducir audio');
        }
      }, { once:true });
  
      audio.addEventListener('error', () => {
        console.warn('Audio no encontrado:', url);
      });
    }
  
    // ---------------- AR unificado ----------------
    function openARFor(name){
      const usdz = usdzUrl(name);
      const glb  = glbUrl(name);
      if (isIOS) { window.location.href = usdz; return; }
      if (isAndroid){
        const file = new URL(glb, location.origin).toString();
        const intent = `intent://arvr.google.com/scene-viewer/1.0?file=${encodeURIComponent(file)}&mode=ar_preferred#Intent;scheme=https;package=com.google.ar.core;action=android.intent.action.VIEW;S.browser_fallback_url=${encodeURIComponent(location.href)};end;`;
        window.location.href = intent;
      }
    }
  
    // ---------------- Cartela ----------------
    function showHelp(){
      skel.classList.add('hidden');
      msg.classList.remove('hidden');
      msg.innerHTML = `
        <div>
          <b>Falta parámetro en la URL.</b><br/><br/>
          Usa ejemplos:<br/>
          <code>?type=glb&model=cristo-yacente</code><br/>
          <code>?type=splat&figure=calvo-anillo</code>
        </div>`;
    }
  
    let infoData = {
      "cristo-yacente":      { title:"Cristo Yacente", meta:"s. XVII · Autor/a desconocido/a", desc:"Descripción pendiente." },
      "virgen-romanica":     { title:"Virgen Románica", meta:"s. XII · Talla policromada", desc:"Descripción pendiente." },
      "san-jose-con-el-nino":{ title:"San José con el Niño", meta:"s. XVIII", desc:"Descripción pendiente." },
      "cristo-en-la-cruz":   { title:"Cristo en la Cruz", meta:"s. XVII", desc:"Descripción pendiente." }
    };
  
    // === Configuración de cámara por figura ===
        // Valores equilibrados sugeridos para cada tipo de pieza del museo
        const cameraSettings = {

        // 🕊️ Esculturas grandes o de cuerpo entero
        "cristo-yacente": {
          orbit: "0deg 80deg 10m",     // mira al rostro
          target: "0m 2.5m 0m",       // vista más elevadasa
          minRadius: "3m",
          maxRadius: "9m",
          minFov: "20deg",
          maxFov: "45deg"
        },
        "cristo-en-la-cruz": {
          orbit: "0deg 60deg 3.5m",
          target: "0m 1.8m 0m",
          minRadius: "2m",
          maxRadius: "5m",
          minFov: "22deg",
          maxFov: "45deg"
        },
        "san-jose-con-el-nino": {
          orbit: "0deg 65deg 3m",
          target: "0m 0.8m 0m",
          minRadius: "1.5m",
          maxRadius: "6m",
          minFov: "22deg",
          maxFov: "45deg"
        },
        "san-bernardo-con-la-virgen": {
          orbit: "0deg 65deg 3m",
          target: "0m 0.8m 0m",
          minRadius: "1.5m",
          maxRadius: "5m",
          minFov: "22deg",
          maxFov: "45deg"
        },
        "virgen-asuncion": {
          orbit: "0deg 60deg 2.8m",
          target: "0m 0.75m 0m",
          minRadius: "1.5m",
          maxRadius: "5m",
          minFov: "20deg",
          maxFov: "45deg"
        },
        "virgen-de-mena": {
          orbit: "0deg 60deg 3m",
          target: "0m 0.8m 0m",
          minRadius: "1.5m",
          maxRadius: "6m",
          minFov: "22deg",
          maxFov: "45deg"
        },

        // 🕯️ Esculturas pequeñas, bustos o reliquias
        "virgen-romanica": {
          orbit: "0deg 55deg 2.5m",
          target: "0m 0.35m 0m",
          minRadius: "1.2m",
          maxRadius: "5m",
          minFov: "20deg",
          maxFov: "45deg"
        },
        "ecce-homo": {
          orbit: "0deg 60deg 2.2m",
          target: "0m 0.4m 0m",
          minRadius: "1.0m",
          maxRadius: "4m",
          minFov: "20deg",
          maxFov: "45deg"
        },
        "reliquia-dorada": {
          orbit: "0deg 60deg 1.8m",
          target: "0m 0.25m 0m",
          minRadius: "0.8m",
          maxRadius: "3m",
          minFov: "20deg",
          maxFov: "45deg"
        },
        "bargueno-relicario": {
          orbit: "0deg 55deg 2.8m",
          target: "0m 0.4m 0m",
          minRadius: "1.2m",
          maxRadius: "5m",
          minFov: "20deg",
          maxFov: "45deg"
        },

        // 🎨 Obras planas o textiles
        "tapiz": {
          orbit: "0deg 90deg 3m",     // vista totalmente frontal
          target: "0m 1.2m 0m",       // centra la zona media del tapiz
          minRadius: "2m",
          maxRadius: "6m",
          minFov: "25deg",
          maxFov: "45deg"
        },
        "casulla-santa-ana": {
          orbit: "0deg 85deg 2.5m",
          target: "0m 1.0m 0m",
          minRadius: "1.5m",
          maxRadius: "5m",
          minFov: "25deg",
          maxFov: "45deg"
        },

        // ⚰️ Otras piezas varias
        "novisimos": {
          orbit: "0deg 60deg 2.8m",
          target: "0m 0.6m 0m",
          minRadius: "1.2m",
          maxRadius: "5m",
          minFov: "22deg",
          maxFov: "45deg"
        },
        "jesus-atado-a-la-columna": {
          orbit: "0deg 65deg 2.8m",
          target: "0m 0.8m 0m",
          minRadius: "1.2m",
          maxRadius: "5m",
          minFov: "22deg",
          maxFov: "45deg"
        }
        };

  
    function buildMeta(d){
      if (!d) return '';
      if (d.author || d.year || d.material) {
        const parts = [];
        if (d.year) parts.push(d.year);
        if (d.author) parts.push(d.author);
        if (d.material) parts.push(d.material);
        return parts.filter(Boolean).join(' · ');
      }
      return d.meta || '';
    }
  
    function renderInfo(s){
      const d = infoData[s] || null;
      const nice = (x) => (x||s||'').replace(/-/g,' ').trim();
      if (topBar && s){
        topBar.classList.remove('hidden');
        pieceTitle.textContent = d?.title || nice(s);
      }
      infoTitle.textContent = d?.title || nice(s);
      infoMeta.textContent  = buildMeta(d);
      infoDesc.textContent  = d?.desc || '';
    }
  
    // ---------------- Cartela e interacción ----------------
    function openSheet(){ renderInfo(slug); sheet.classList.remove('hidden'); sheet.setAttribute('aria-hidden','false'); }
    function closeSheet(){ sheet.classList.add('hidden'); sheet.setAttribute('aria-hidden','true'); }
  
    if (infoBtn) infoBtn.addEventListener('click', openSheet);
    sheetClose.addEventListener('click', closeSheet);
    sheet.addEventListener('click', (e)=>{ if (e.target === sheet) closeSheet(); });
    window.addEventListener('keydown', (e)=>{ if (e.key === 'Escape') closeSheet(); });
  
    // ---------------- Inicialización ----------------
    (async function init(){
      try{
        if (type === 'glb' && model){
          document.body.classList.remove('mode-splat');
          mv.src = glbUrl(model);
  
          // === Configuración de cámara por figura ===
          const cam = cameraSettings[model];
          if (cam) {
            if (cam.orbit) mv.cameraOrbit = cam.orbit;
            if (cam.target) mv.cameraTarget = cam.target;
            if (cam.minRadius) mv.minCameraOrbit = `auto auto ${cam.minRadius}`;
            if (cam.maxRadius) mv.maxCameraOrbit = `auto auto ${cam.maxRadius}`;
            if (cam.minFov) mv.minFieldOfView = cam.minFov;
            if (cam.maxFov) mv.maxFieldOfView = cam.maxFov;
          }
  
          // === HDR suave ===
          try {
            await fetch('/assets/hdr/museo-suave.hdr', { cache: 'force-cache' }).catch(()=>{});
            mv.environmentImage = '/assets/hdr/museo-suave.hdr';
            mv.exposure = '2';
            mv.shadowIntensity = '0.7';
            mv.shadowSoftness = '1.0';
            mv.environmentRotation = '10deg';
            mv.skyboxImage = '/assets/hdr/museo-suave-blur.webp';
            mv.backgroundColor = '#0f1115';
            console.log('HDR suave aplicado');
          } catch (e) {
            console.warn('No se pudo aplicar el HDR, usando neutral', e);
          }
  
          mv.iosSrc = usdzUrl(model);
          mv.classList.remove('hidden');
  
          // Oculta botón AR nativo
          if (!mv.querySelector('[slot="ar-button"]')) {
            const blocker = document.createElement('button');
            blocker.setAttribute('slot','ar-button');
            blocker.setAttribute('aria-hidden','true');
            blocker.style.display = 'none';
            blocker.tabIndex = -1;
            mv.appendChild(blocker);
          }
  
          // Botón AR unificado
          arBtn.classList.remove('hidden');
          arBtn.onclick = () => {
            if (mv?.activateAR) mv.activateAR().catch(()=> openARFor(model));
            else openARFor(model);
          };
  
          if (slug) renderInfo(slug);
          setupAudioFor(model);
          skel.classList.add('hidden');
          return;
        }
  
        if (type === 'splat' && figure){
          document.body.classList.add('mode-splat');
          splat.src = splatUrl(figure);
          splat.classList.remove('hidden');
  
          arBtn.classList.remove('hidden');
          arBtn.onclick = () => openARFor(figure);
  
          if (slug) renderInfo(slug);
          setupAudioFor(figure);
          skel.classList.add('hidden');
          return;
        }
  
        // Sin parámetros válidos:
        showHelp();
  
      } catch(err){
        console.error(err);
        msg.classList.remove('hidden');
        msg.innerHTML = `<b>Error:</b> ${String(err).replace(/</g,'&lt;')}`;
        skel.classList.add('hidden');
      }
    })();
  });
  </script>
  

</body>
</html>
