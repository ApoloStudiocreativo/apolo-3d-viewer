<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover" />
  <title>Museo Virtual San Joaquín y Santa Ana</title>

  <!-- Tipografía para títulos -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600&display=swap" rel="stylesheet">

  <!-- CSS principal -->
  <link rel="stylesheet" href="/index.css">

  <!-- Datos/metadatos -->
  <link rel="preload" href="/assets/info.json" as="fetch" type="application/json" crossorigin="anonymous">

  <!-- HDR / skybox -->
  <link rel="preload" as="image" href="/assets/hdr/museo-suave.hdr">
  <link rel="preload" as="image" href="/assets/hdr/museo-suave-blur.webp">

  <!-- model-viewer (GLB) -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>

  <style>
    :root{
      --bg:#0f1115;
      --text:#e9eef7;
      --muted:#9aa4b2;
      --brand:#40cbcb;
      --shadow:0 10px 30px rgba(0,0,0,.35);
      --fab-bottom: max(18px, env(safe-area-inset-bottom));
    }
    html,body{margin:0;height:100%;background:var(--bg);color:var(--text);overflow:hidden}
    .full{position:fixed;inset:0}
    .hidden{display:none!important}

    /* Contenedores de vista */
    model-viewer, iframe#splat {
      width:100vw; height:100dvh; display:block; background:var(--bg);
    }
    iframe#splat{border:0}

    /* Mensaje de error/ayuda */
    #msg{
      position:fixed; inset:0;
      display:flex; align-items:center; justify-content:center;
      font:500 16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      text-align:center; color:var(--muted);
      padding:24px;
    }
    #msg b{color:#ff6464}

    /* Botón AR: visible solo en móvil/tablet */
    .ar-fab{
      position:fixed; left:50%; bottom: var(--fab-bottom); transform:translateX(-50%);
      display:none; /* por defecto oculto, se activa con media query */
      gap:10px; align-items:center; justify-content:center;
      height:56px; padding:0 18px; min-width:180px;
      border:none; border-radius:16px; cursor:pointer;
      background:var(--brand); color:white; font-weight:700; font-size:16px; letter-spacing:.2px;
      box-shadow:var(--shadow);
      z-index:20;
    }
    .ar-fab:active{transform:translateX(-50%) scale(.98)}
    .ar-fab svg{width:22px;height:22px}

    /* Solo móvil/tablet */
    @media (max-width:1024px){
      .ar-fab{display:flex}
    }

    /* Esqueleto simple mientras carga */
    .skeleton{
      position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
      background:linear-gradient(160deg,#101319 0%,#0b0e13 100%);
      color:#7b8696; font:500 14px system-ui,-apple-system,Segoe UI,Roboto,Arial;
      z-index:50;
    }
    .spinner{width:28px;height:28px;border-radius:50%;border:3px solid rgba(255,255,255,.15);border-top-color:#fff;animation:rot .9s linear infinite;margin-right:10px}
    @keyframes rot{to{transform:rotate(360deg)}}

    /* Poster previo al SPLAT */
    .splat-poster {
      position: fixed; inset: 0;
      background: center center / cover no-repeat #0f1115;
      z-index: 30;
      opacity: 0;
      pointer-events: none;
      transition: opacity .25s ease;
    }
    .splat-poster.visible { opacity: 1; }
    .splat-poster.fade-out {
      opacity: 0;
      transition: opacity .45s ease-out;
    }

    /* Overlay "Abriendo AR…" */
    .ar-loading{
      position: fixed; inset: 0; z-index: 60;
      display: grid; place-items: center;
      background: rgba(10,12,16,.65);
      backdrop-filter: blur(6px);
      opacity: 0; pointer-events: none;
      transition: opacity .25s ease;
    }
    .ar-loading.visible{ opacity: 1; pointer-events: auto; }
    .ar-loading .spinner{ margin-right: 10px; }
    .ar-loading span{
      color: var(--text);
      font: 600 14px/1.2 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      letter-spacing: .2px;
    }
    .ar-loading .spinner + span { display:inline-block; vertical-align: middle; }
  </style>
</head>

<body>
  <!-- Topbar -->
  <header id="topBar" class="hidden">
    <h1 id="pieceTitle"></h1>
    <button id="infoBtn" class="info-btn" type="button" aria-label="Mostrar información">Información</button>
  </header>

  <!-- Mensaje si faltan parámetros -->
  <div id="msg" class="hidden"></div>

  <!-- Overlay skeleton -->
  <div id="skel" class="skeleton"><div class="spinner"></div>Cargando…</div>

  <!-- Vista GLB -->
  <model-viewer id="mv" class="hidden"
    poster="/models/placeholder.webp"
    alt="Modelo 3D"
    camera-controls
    touch-action="pan-y"
    ar
    ar-modes="scene-viewer quick-look webxr"
    ar-scale="fixed"
    ar-placement="floor"
    environment-image="neutral"
    shadow-intensity="1.2"
    shadow-softness="0.9"
    exposure="1"
    camera-orbit="0deg 70deg 1.5m"
    field-of-view="30deg">
  </model-viewer>

  <!-- Vista SPLAT -->
  <iframe
    id="splat"
    class="hidden"
    loading="lazy"
    allow="autoplay; fullscreen; xr-spatial-tracking; camera; microphone; gyroscope; accelerometer">
  </iframe>

  <!-- Poster temporal antes del SPLAT -->
  <div id="splatPoster" class="splat-poster hidden" aria-hidden="true"></div>

  <!-- FABs -->
  <div id="fabRow" class="fab-row">
    <!-- AUDIO (izquierda) -->
    <button id="audioBtn" class="audio-fab hidden" type="button" aria-label="Reproducir audio" aria-pressed="false">
      <!-- Icono ALTAVOZ (parado) -->
      <svg class="icon-play" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M4 9v6h3l5 4V5L7 9H4z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M15 10.5a3.5 3.5 0 010 3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        <path d="M17.5 8a6 6 0 010 8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
      <!-- Icono PAUSA (reproduciendo) -->
      <svg class="icon-pause" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <rect x="6" y="5" width="4" height="14" rx="1.2" stroke="currentColor" stroke-width="1.8"/>
        <rect x="14" y="5" width="4" height="14" rx="1.2" stroke="currentColor" stroke-width="1.8"/>
      </svg>
    </button>

    <!-- AR (derecha) -->
    <button id="arBtn" class="ar-fab hidden" type="button" aria-label="Ver en AR">
      <svg viewBox="0 0 24 24" fill="none"><path d="M12 3l8.66 5v8L12 21l-8.66-5V8L12 3zM12 3v18M3.34 8L12 13l8.66-5" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Ver en AR
    </button>
  </div>

  <!-- Overlay de carga AR -->
  <div id="arLoading" class="ar-loading hidden" aria-hidden="true">
    <div class="spinner" aria-hidden="true"></div>
    <span>Abriendo AR…</span>
  </div>

  <!-- Cartela -->
  <div id="infoSheet" class="info-sheet hidden" aria-hidden="true">
    <div class="info-sheet__drag"></div>
    <button id="infoClose" class="info-sheet__close" aria-label="Cerrar">✕</button>
    <div class="info-sheet__content">
      <h2 id="infoTitle">Obra</h2>
      <p class="info-meta" id="infoMeta"></p>
      <p class="info-desc" id="infoDesc"></p>
    </div>
  </div>

  <!-- Link AR iOS oculto -->
  <a id="iosARLink" rel="ar" style="display:none" aria-hidden="true"></a>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
    
      // ---------------- URL: soporta query *y* pathname limpias ----------------
      const qs = new URLSearchParams(location.search);
      let type   = (qs.get('type')   || '').toLowerCase();   // 'glb' | 'splat'
      let model  = (qs.get('model')  || '').toLowerCase();
      let figure = (qs.get('figure') || '').toLowerCase();
    
      if (!type) {
        const parts = location.pathname.split('/').filter(Boolean);
        if (parts[0] === 'splat' && parts[1]) {
          type = 'splat'; figure = parts[1];
        } else if (parts.length === 1) {
          type = 'glb'; model = parts[0]; // /:slug → GLB por defecto
        }
      }
      const slug = model || figure || '';
    
      // ---------------- Elementos del DOM ----------------
      const mv      = document.getElementById('mv');
      const splat   = document.getElementById('splat');
      const skel    = document.getElementById('skel');
      const msg     = document.getElementById('msg');
      const arBtn   = document.getElementById('arBtn');
      const topBar  = document.getElementById('topBar');
      const pieceTitle = document.getElementById('pieceTitle');
      const infoBtn = document.getElementById('infoBtn');
      const sheet   = document.getElementById('infoSheet');
      const sheetClose = document.getElementById('infoClose');
      const infoTitle  = document.getElementById('infoTitle');
      const infoMeta   = document.getElementById('infoMeta');
      const infoDesc   = document.getElementById('infoDesc');
      const audioBtn   = document.getElementById('audioBtn');
    
      // ---------------- Rutas y helpers ----------------
      const glbUrl   = (name) => `/models/${name}/${name}.glb`;
      const usdzUrl  = (name) => `/models/${name}/${name}.usdz`;
      const splatUrl = (name) => `/splat/${name}/index.html`;
    
      const isIOS     = /iPad|iPhone|iPod/i.test(navigator.userAgent) ||
                        (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      const isAndroid = /Android/.test(navigator.userAgent);
    
      // ---------------- Overlay AR ----------------
      const showARLoading = () => {
        const el = document.getElementById('arLoading');
        if (!el) return;
        el.classList.remove('hidden');
        requestAnimationFrame(()=> el.classList.add('visible'));
      };
      const hideARLoading = () => {
        const el = document.getElementById('arLoading');
        if (!el) return;
        el.classList.remove('visible');
        setTimeout(()=> el.classList.add('hidden'), 250);
      };
      document.addEventListener('visibilitychange', ()=>{ if (!document.hidden) hideARLoading(); });
    
      // ---------------- Audio por figura ----------------
      let audio = null;
      function setupAudioFor(id){
        const url = `/assets/audio/${id}.mp3`;
        if (audio) { try { audio.pause(); } catch{} audio = null; }
        audio = new Audio(url);
        audio.loop = true;
        audio.preload = 'none';
    
        audioBtn.classList.remove('hidden');
        audioBtn.classList.remove('is-playing');
        audioBtn.setAttribute('aria-pressed','false');
        audioBtn.setAttribute('aria-label','Reproducir audio');
    
        audioBtn.onclick = async () => {
          if (!audio) return;
          if (audio.paused) {
            try {
              await audio.play();
              audioBtn.classList.add('is-playing');
              audioBtn.setAttribute('aria-pressed','true');
              audioBtn.setAttribute('aria-label','Pausar audio');
            } catch(e){ console.log('Bloqueo autoplay:', e); }
          } else {
            audio.pause();
            audioBtn.classList.remove('is-playing');
            audioBtn.setAttribute('aria-pressed','false');
            audioBtn.setAttribute('aria-label','Reproducir audio');
          }
        };
      }
    
      // ---------------- Quick Look helper ----------------
      function openQuickLookSync(slug) {
        try {
          const link = document.getElementById('iosARLink');
          if (!link) return false;
          const ts = Date.now(); // cache-buster
          link.setAttribute('href', `/models/${slug}/${slug}.usdz#${ts}`);
          link.click();
          return true;
        } catch {
          return false;
        }
      }
    
      // ---------------- Main Init ----------------
      (async function init(){
        try{
          if (type === 'glb' && model){
            document.body.classList.remove('mode-splat');
            mv.src = glbUrl(model);
    
            // === Preload AR assets ===
            try {
              [glbUrl(model), usdzUrl(model)].forEach(u =>
                fetch(u, { method:'HEAD', cache:'force-cache', keepalive:true }).catch(()=>{})
              );
            } catch{}
    
            // === Mostrar modelo ===
            mv.classList.remove('hidden');
            skel.classList.add('hidden');
            arBtn.classList.remove('hidden');
    
            // ===== Botón AR robusto =====
            function setArBusy(state){
              arBtn.classList.toggle('is-busy', state);
              arBtn.toggleAttribute('disabled', state);
              arBtn.setAttribute('aria-busy', state ? 'true' : 'false');
            }
    
            function openViaAnchor(url, relAR = false){
              const a = document.createElement('a');
              a.href = url;
              if (relAR) a.rel = 'ar';
              a.style.display = 'none';
              document.body.appendChild(a);
              a.click();
              requestAnimationFrame(()=> { try{ document.body.removeChild(a); }catch{} });
            }
    
            arBtn.onclick = async () => {
              if (arBtn.classList.contains('is-busy')) return;
              setArBusy(true);
              showARLoading();
    
              const finish = () => {
                const clear = () => { hideARLoading(); setArBusy(false); document.removeEventListener('visibilitychange', clear); };
                document.addEventListener('visibilitychange', () => { if (!document.hidden) clear(); });
                setTimeout(() => { if (!document.hidden) { hideARLoading(); setArBusy(false); } }, 8000);
              };
    
              try {
                if (isIOS) {
                  let ok = false;
                  try { ok = openQuickLookSync(model); } catch {}
                  if (!ok) {
                    openViaAnchor(usdzUrl(model), true);
                    setTimeout(() => { if (!document.hidden) window.location.href = usdzUrl(model); }, 120);
                  }
                  finish();
                  return;
                }
    
                if (isAndroid) {
                  if (mv && typeof mv.activateAR === 'function') {
                    try { await mv.activateAR(); finish(); return; } catch {}
                  }
                  const file = new URL(glbUrl(model), location.origin).toString();
                  const intent = `intent://arvr.google.com/scene-viewer/1.0?file=${encodeURIComponent(file)}&mode=ar_preferred&title=${encodeURIComponent(infoTitle?.textContent?.trim() || model)}#Intent;scheme=https;package=com.google.android.googlequicksearchbox;action=android.intent.action.VIEW;end;`;
                  openViaAnchor(intent, false);
                  setTimeout(() => { if (!document.hidden) window.location.href = intent; }, 120);
                  finish();
                  return;
                }
    
                if (mv && typeof mv.activateAR === 'function') {
                  await mv.activateAR().catch(()=> openViaAnchor(glbUrl(model)));
                } else {
                  openViaAnchor(glbUrl(model));
                }
              } catch {
                openViaAnchor(glbUrl(model));
              } finally {
                finish();
              }
            };
    
            setupAudioFor(model);
            return;
          }
    
          if (type === 'splat' && figure){
            document.body.classList.add('mode-splat');
            splat.src = splatUrl(figure);
            splat.classList.remove('hidden');
            skel.classList.add('hidden');
            arBtn.classList.remove('hidden');
    
            // === Preload AR assets ===
            try {
              [glbUrl(figure), usdzUrl(figure)].forEach(u =>
                fetch(u, { method:'HEAD', cache:'force-cache', keepalive:true }).catch(()=>{})
              );
            } catch{}
    
            // ===== Botón AR robusto (SPLAT) =====
            function setArBusy(state){
              arBtn.classList.toggle('is-busy', state);
              arBtn.toggleAttribute('disabled', state);
              arBtn.setAttribute('aria-busy', state ? 'true' : 'false');
            }
    
            function openViaAnchor(url, relAR = false){
              const a = document.createElement('a');
              a.href = url;
              if (relAR) a.rel = 'ar';
              a.style.display = 'none';
              document.body.appendChild(a);
              a.click();
              requestAnimationFrame(()=> { try{ document.body.removeChild(a); }catch{} });
            }
    
            arBtn.onclick = async () => {
              if (arBtn.classList.contains('is-busy')) return;
              setArBusy(true);
              showARLoading();
    
              const finish = () => {
                const clear = () => { hideARLoading(); setArBusy(false); document.removeEventListener('visibilitychange', clear); };
                document.addEventListener('visibilitychange', () => { if (!document.hidden) clear(); });
                setTimeout(() => { if (!document.hidden) { hideARLoading(); setArBusy(false); } }, 8000);
              };
    
              try {
                if (isIOS) {
                  let ok = false;
                  try { ok = openQuickLookSync(figure); } catch {}
                  if (!ok) {
                    openViaAnchor(usdzUrl(figure), true);
                    setTimeout(() => { if (!document.hidden) window.location.href = usdzUrl(figure); }, 120);
                  }
                  finish();
                  return;
                }
    
                if (isAndroid) {
                  if (mv && typeof mv.activateAR === 'function') {
                    try { await mv.activateAR(); finish(); return; } catch {}
                  }
                  const file = new URL(glbUrl(figure), location.origin).toString();
                  const intent = `intent://arvr.google.com/scene-viewer/1.0?file=${encodeURIComponent(file)}&mode=ar_preferred&title=${encodeURIComponent(infoTitle?.textContent?.trim() || figure)}#Intent;scheme=https;package=com.google.android.googlequicksearchbox;action=android.intent.action.VIEW;end;`;
                  openViaAnchor(intent, false);
                  setTimeout(() => { if (!document.hidden) window.location.href = intent; }, 120);
                  finish();
                  return;
                }
    
                if (mv && typeof mv.activateAR === 'function') {
                  await mv.activateAR().catch(()=> openViaAnchor(glbUrl(figure)));
                } else {
                  openViaAnchor(glbUrl(figure));
                }
              } catch {
                openViaAnchor(glbUrl(figure));
              } finally {
                finish();
              }
            };
    
            setupAudioFor(figure);
            return;
          }
    
          msg.classList.remove('hidden');
          msg.innerHTML = `<b>Error:</b> Parámetros de URL incorrectos.`;
          skel.classList.add('hidden');
        } catch(err){
          console.error(err);
        }
      })();
    
      /* === Interacción táctil para arrastrar la cartela === */
      (function enableInfoSheetDrag() {
        const sheet = document.getElementById('infoSheet');
        const infoBtn = document.getElementById('infoBtn');
        if (!sheet || !infoBtn) return;
    
        let startY = 0;
        let currentY = 0;
        let isDragging = false;
        const threshold = 90;
    
        const onStart = (e) => {
          if (e.touches?.length !== 1) return;
          startY = e.touches[0].clientY;
          isDragging = true;
          sheet.style.transition = 'none';
        };
        const onMove = (e) => {
          if (!isDragging || e.touches?.length !== 1) return;
          currentY = e.touches[0].clientY - startY;
          if (currentY > 0) {
            sheet.style.transform = `translateY(${currentY}px)`;
            sheet.style.opacity = `${1 - Math.min(currentY / 250, 0.4)}`;
          }
        };
        const closeSheetSmooth = () => {
          sheet.style.transition = 'transform .28s ease, opacity .28s ease';
          sheet.style.transform = 'translateY(100%)';
          sheet.style.opacity = '0';
          setTimeout(() => {
            sheet.classList.add('hidden');
            sheet.setAttribute('aria-hidden','true');
            sheet.style.transform = '';
            sheet.style.opacity = '';
          }, 280);
        };
        const onEnd = () => {
          if (!isDragging) return;
          sheet.style.transition = 'transform .28s ease, opacity .28s ease';
          if (currentY > threshold) {
            closeSheetSmooth();
          } else {
            sheet.style.transform = 'translateY(0)';
            sheet.style.opacity = '1';
          }
          isDragging = false;
          startY = 0;
          currentY = 0;
        };
    
        sheet.addEventListener('touchstart', onStart, { passive: true });
        sheet.addEventListener('touchmove', onMove, { passive: true });
        sheet.addEventListener('touchend', onEnd);
    
        infoBtn.addEventListener('click', () => {
          sheet.classList.remove('hidden');
          sheet.setAttribute('aria-hidden','false');
          sheet.style.transform = 'translateY(0)';
          sheet.style.opacity = '1';
        });
      })();
    
    });
    </script>
    
</body>
</html>
