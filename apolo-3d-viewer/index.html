<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover" />
  <title>Visor Universal 3D + AR</title>

  <link rel="stylesheet" href="./index.css">
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>

  <style>
    :root{
      --bg:#0f1115;
      --text:#e9eef7;
      --muted:#9aa4b2;
      --brand:#40cbcb;
      --shadow:0 10px 30px rgba(0,0,0,.35);

      /* altura base de botones flotantes */
      --fab-bottom: 24px;
    }

    /* En vistas SPLAT subimos los FABs para no tapar la UI del viewer */
    body.mode-splat{
      --fab-bottom: 96px; /* ajustable tras probar en varios móviles */
    }

    html,body{margin:0;height:100%;background:var(--bg);color:var(--text);overflow:hidden}
    .hidden{display:none!important}

    model-viewer, iframe#splat{width:100vw;height:100dvh;display:block;background:var(--bg)}
    iframe#splat{border:0}

    #msg{
      position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
      font:500 16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,Arial;text-align:center;color:var(--muted);padding:24px
    }
    #msg b{color:#ff6464}

    .skeleton{
      position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
      background:linear-gradient(160deg,#101319 0%,#0b0e13 100%);color:#7b8696;font:500 14px system-ui,-apple-system,Segoe UI,Roboto,Arial
    }
    .spinner{width:28px;height:28px;border-radius:50%;border:3px solid rgba(255,255,255,.15);border-top-color:#fff;animation:rot .9s linear infinite;margin-right:10px}
    @keyframes rot{to{transform:rotate(360deg)}}

    /* FAB AR centrado y alineado con el offset */
    .ar-fab{
      position:fixed;
      left:50%;
      bottom:calc(var(--fab-bottom) + env(safe-area-inset-bottom));
      transform:translateX(-50%);
      display:none;gap:10px;align-items:center;justify-content:center;
      height:56px;padding:0 18px;min-width:180px;
      border:none;border-radius:100px;cursor:pointer;
      background:var(--brand);color:#fff;font-weight:700;font-size:16px;letter-spacing:.2px;
      box-shadow:var(--shadow);z-index:20;
    }
    .ar-fab svg{width:22px;height:22px}
    .ar-fab:active{transform:translateX(-50%) scale(.98)}
    @media (max-width:1024px){.ar-fab{display:flex}}

    /* Botón Play/Pausa bonito (glass) a la derecha */
    #audio-nudge{
      position:fixed;
      right:calc(16px + env(safe-area-inset-right));
      bottom:calc(var(--fab-bottom) + env(safe-area-inset-bottom));
      display:none; /* se muestra via JS cuando hay fuente */
      align-items:center;gap:10px;
      padding:12px 16px;
      border-radius:999px;border:1px solid rgba(255,255,255,.14);
      background:rgba(17,21,28,.6);
      color:#fff;
      font:600 14px/1 system-ui,-apple-system,Segoe UI,Roboto,Arial;
      box-shadow:0 8px 24px rgba(0,0,0,.35);
      backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
      z-index:30;transform:translateZ(0);
    }
    #audio-nudge svg{width:18px;height:18px;flex:0 0 18px}
    #audio-nudge:active{transform:translateZ(0) scale(.98)}
    #audio-nudge.playing{background:rgba(27,33,43,.7);border-color:rgba(255,255,255,.22)}
    @media (min-width:1025px){ #audio-nudge{display:none!important} }

    #global-audio{display:none}
  </style>
</head>
<body>

  <div id="msg" class="hidden"></div>
  <div id="skel" class="skeleton"><div class="spinner"></div>Cargando…</div>

  <!-- GLB -->
  <model-viewer id="mv" class="hidden"
    alt="Modelo 3D" camera-controls touch-action="pan-y"
    ar ar-modes="webxr scene-viewer quick-look"
    environment-image="neutral"
    shadow-intensity="1.2" shadow-softness="0.9"
    exposure="1"
    camera-orbit="0deg 70deg 1.5m"
    min-camera-orbit="auto auto 0.4m"
    max-camera-orbit="auto auto 6m"
    field-of-view="30deg">
  </model-viewer>

  <!-- SPLAT (prohibimos autoplay interno) -->
  <iframe
    id="splat"
    class="hidden"
    allow="xr; xr-spatial-tracking; gyroscope; accelerometer; autoplay 'none'">
  </iframe>

  <!-- FAB AR -->
  <button id="arBtn" class="ar-fab hidden" type="button" aria-label="Ver en AR">
    <svg viewBox="0 0 24 24" fill="none"><path d="M12 3l8.66 5v8L12 21l-8.66-5V8L12 3zM12 3v18M3.34 8L12 13l8.66-5" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    Ver en AR
  </button>

  <!-- Botón Play/Pausa (bonito) -->
  <button id="audio-nudge" type="button" aria-label="Reproducir/Pausar" aria-pressed="false">
    <svg viewBox="0 0 24 24" fill="none">
      <path d="M8 5v14l11-7-11-7z" stroke="white" stroke-width="1.6" stroke-linejoin="round"/>
    </svg>
    Sonido
  </button>

  <!-- Audio global -->
  <audio id="global-audio" preload="none" playsinline></audio>

  <script>
  (function(){
    const qs = new URLSearchParams(location.search);
    const type   = (qs.get('type')||'').toLowerCase();
    const model  = (qs.get('model')||'').toLowerCase();
    const figure = (qs.get('figure')||'').toLowerCase();

    const mv    = document.getElementById('mv');
    const splat = document.getElementById('splat');
    const arBtn = document.getElementById('arBtn');
    const audioEl = document.getElementById('global-audio');
    const audioBtn = document.getElementById('audio-nudge');
    const skel  = document.getElementById('skel');
    const msg   = document.getElementById('msg');

    const glbUrl   = n => `/models/${n}/${n}.glb`;
    const usdzUrl  = n => `/models/${n}/${n}.usdz`;
    const splatUrl = n => `/splat/${n}/index.html`;
