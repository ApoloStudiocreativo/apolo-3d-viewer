<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Visor Universal 3D + AR</title>

<link rel="stylesheet" href="./index.css">
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>

<style>
:root {
  --bg: #0f1115;
  --text:#e9eef7;
  --muted:#9aa4b2;
  --brand:#40cbcb;
  --shadow:0 10px 30px rgba(0,0,0,.35);
  --fab-bottom: calc(22px + env(safe-area-inset-bottom));
}

/* SPLAT: botones más arriba */
body.mode-splat {
  --fab-bottom: calc(90px + env(safe-area-inset-bottom));
}

html, body {
  margin:0;
  height:100%;
  background:var(--bg);
  color:var(--text);
  overflow:hidden;
}

.hidden { display:none !important }

model-viewer, iframe#splat {
  width:100vw;
  height:100dvh;
  display:block;
  background:var(--bg);
}
iframe#splat { border:0 }

/* Loader y mensaje ayuda (sin tocar) */
#msg, .skeleton{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}

/* FAB AR DERECHA */
.ar-fab {
  position:fixed;
  bottom:var(--fab-bottom);
  right:calc(16px + env(safe-area-inset-right));

  display:none;
  height:56px;
  padding:0 18px;
  min-width:180px;
  border:none;
  border-radius:50px;
  cursor:pointer;
  align-items:center;
  justify-content:center;
  gap:10px;
  background:var(--brand);
  color:white;
  font:700 16px system-ui;
  box-shadow:var(--shadow);
  z-index:20;
}
.ar-fab svg{ width:22px; height:22px }
@media(max-width:1024px){ .ar-fab{ display:flex } }

/* ✅ BOTÓN AUDIO IZQUIERDA */
#audio-nudge {
  position:fixed;
  bottom:var(--fab-bottom);
  left:calc(16px + env(safe-area-inset-left));

  display:none;
  height:56px;
  padding:0 18px;
  min-width:180px;
  border:none;
  border-radius:50px;
  cursor:pointer;
  align-items:center;
  justify-content:center;
  gap:10px;
  background:rgba(17,21,28,.6);
  border:1px solid rgba(255,255,255,.14);
  color:white;
  font:700 16px system-ui;
  box-shadow:var(--shadow);
  backdrop-filter:blur(8px);
  z-index:30;
}
#audio-nudge svg{ width:22px;height:22px }
#audio-nudge.playing{
  background:rgba(27,33,43,.7);
  border-color:rgba(255,255,255,.22);
}
@media(min-width:1025px){ #audio-nudge{display:none!important} }

</style>
</head>
<body>

<div id="msg" class="hidden"></div>
<div id="skel" class="skeleton"><div class="spinner"></div>Cargando…</div>

<model-viewer id="mv" class="hidden"
  camera-controls
  ar ar-modes="webxr scene-viewer quick-look">
</model-viewer>

<iframe id="splat" class="hidden" allow="xr; xr-spatial-tracking; gyroscope; accelerometer; autoplay 'none'"></iframe>

<button id="audio-nudge" type="button" aria-label="Audio">
  <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7-11-7z" stroke="white" stroke-width="1.6"/></svg>
  Sonido
</button>

<button id="arBtn" class="ar-fab hidden" type="button" aria-label="AR">
  <svg viewBox="0 0 24 24"><path d="M12 3l8.66 5v8L12 21l-8.66-5V8L12 3zM12 3v18M3.34 8L12 13l8.66-5" stroke="white" stroke-width="1.8"/></svg>
  Ver en AR
</button>

<audio id="global-audio" preload="none" playsinline></audio>

<script>
(function(){
  const qs = new URLSearchParams(location.search);
  const type = (qs.get('type')||'').toLowerCase();
  const model = (qs.get('model')||'').toLowerCase();
  const figure = (qs.get('figure')||'').toLowerCase();

  const mv = document.getElementById('mv');
  const splat = document.getElementById('splat');
  const arBtn = document.getElementById('arBtn');
  const audioEl = document.getElementById('global-audio');
  const audioBtn = document.getElementById('audio-nudge');
  const skel = document.getElementById('skel');
  const msg = document.getElementById('msg');

  const glbUrl = n => `/models/${n}/${n}.glb`;
  const usdzUrl = n => `/models/${n}/${n}.usdz`;
  const splatUrl = n => `/splat/${n}/index.html`;

  async function fileExists(url){ try{return (await fetch(url,{method:'HEAD'})).ok;}catch{return false;} }

  function syncAudioButton(){
    const hasSrc = !!audioEl?.currentSrc;
    const playing = hasSrc && !audioEl.paused && !audioEl.ended;
    audioBtn.classList.toggle('playing', playing);
    audioBtn.innerHTML = playing
      ? `<svg viewBox="0 0 24 24"><path d="M8 5v14M16 5v14" stroke="white" stroke-width="1.8"/></svg> Pausa`
      : `<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7-11-7z" stroke="white" stroke-width="1.6"/></svg> Sonido`;
  }
  audioBtn.addEventListener('click', async () => {
    if (!audioEl.currentSrc) return;
    try{ audioEl.paused ? await audioEl.play() : await audioEl.pause(); }catch{}
    syncAudioButton();
  });

  async function setupAudio(slug){
    let src = `/assets/audio/${slug}.mp3`;
    if (!(await fileExists(src))) src = `/assets/audio/ambiente.mp3`;
    audioEl.src = src;
    audioEl.pause();
    audioBtn.classList.remove('hidden');
    syncAudioButton();
  }

  function openAR(n){
    if(/iPad|iPhone|iPod/.test(navigator.userAgent)){
      location.href = usdzUrl(n);
    } else {
      const file = new URL(glbUrl(n), location.origin).toString();
      const intent = `intent://arvr.google.com/scene-viewer/1.0?file=${encodeURIComponent(file)}#Intent;scheme=https;package=com.google.ar.core;end;`;
      location.href = intent;
    }
  }

  splat.addEventListener('load',()=>{
    const idoc = splat.contentDocument||splat.contentWindow?.document;
    idoc?.querySelectorAll('audio,video').forEach(m=>{
      m.pause?.(); m.muted=true;
    });
  });

  (async function init(){
    try{
      if(type==='glb' && model){
        document.body.classList.remove('mode-splat');
        mv.src = glbUrl(model);
        mv.classList.remove('hidden');
        await setupAudio(model);

        arBtn.classList.remove('hidden');
        arBtn.onclick = () => openAR(model);
        skel.classList.add('hidden');
        return;
      }

      if(type==='splat' && figure){
        document.body.classList.add('mode-splat');
        splat.src = splatUrl(figure);
        splat.classList.remove('hidden');
        await setupAudio(figure);

        arBtn.classList.remove('hidden');
        arBtn.onclick = () => openAR(figure);
        skel.classList.add('hidden');
        return;
      }

      skel.classList.add('hidden');
      msg.classList.remove('hidden');
      msg.innerHTML="Faltan parámetros";
    }catch{
      skel.classList.add('hidden');
      msg.classList.remove('hidden');
      msg.innerText="Error";
    }
  })();
})();
</script>
</body>
</html>
