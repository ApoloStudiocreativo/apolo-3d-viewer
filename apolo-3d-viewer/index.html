<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0f1115" />
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <title>Museo Virtual San Joaquín y Santa Ana</title>

  <!-- Tipografía para títulos -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600&display=swap" rel="stylesheet">

  <!-- CSS principal -->
  <link rel="stylesheet" href="/index.css">

  <!-- Datos/metadatos -->
  <link rel="preload" href="/assets/info.json" as="fetch" type="application/json" crossorigin="anonymous">

  <!-- HDR / skybox -->
  <link rel="preload" as="image" href="/assets/hdr/museo-suave.hdr">
  <link rel="preload" as="image" href="/assets/hdr/museo-suave-blur.webp">

  <!-- model-viewer (GLB) -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
</head>

<body>
  <!-- Topbar -->
  <header id="topBar" class="hidden">
    <h1 id="pieceTitle"></h1>
    <button id="infoBtn" class="info-btn" type="button" aria-label="Mostrar información">Información</button>
  </header>

  <!-- Mensaje si faltan parámetros -->
  <div id="msg" class="hidden"></div>

  <!-- Overlay skeleton -->
  <div id="skel" class="skeleton">
    <div class="loader-container">
      <div class="loader-circle">
        <div class="loader-progress" id="loaderProgress">0%</div>
      </div>
      <p class="loader-text">Cargando experiencia,<br>puede tardar un poco según tu conexión</p>
    </div>
  </div>
  

  <!-- Vista GLB -->
  <model-viewer id="mv" class="hidden"
    poster="/models/placeholder.webp"
    alt="Modelo 3D"
    camera-controls
    touch-action="pan-y"
    ar
    ar-modes="scene-viewer quick-look webxr"
    ar-scale="fixed"
    ar-placement="floor"
    environment-image="neutral"
    shadow-intensity="1.2"
    shadow-softness="0.9"
    exposure="1"
    camera-orbit="0deg 70deg 1.5m"
    field-of-view="30deg">
  </model-viewer>

  <!-- Vista SPLAT -->
  <iframe
    id="splat"
    class="hidden"
    loading="lazy"
    allow="autoplay; fullscreen; xr-spatial-tracking; camera; microphone; gyroscope; accelerometer">
  </iframe>

  <!-- Poster temporal antes del SPLAT -->
  <div id="splatPoster" class="splat-poster hidden" aria-hidden="true"></div>

  <!-- FABs -->
  <div id="fabRow" class="fab-row">
    <!-- AUDIO (izquierda) -->
    <button id="audioBtn" class="audio-fab hidden" type="button" aria-label="Reproducir audio" aria-pressed="false">
      <!-- Icono ALTAVOZ (parado) -->
      <svg class="icon-play" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M4 9v6h3l5 4V5L7 9H4z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M15 10.5a3.5 3.5 0 010 3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        <path d="M17.5 8a6 6 0 010 8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
      <!-- Icono PAUSA (reproduciendo) -->
      <svg class="icon-pause" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <rect x="6" y="5" width="4" height="14" rx="1.2" stroke="currentColor" stroke-width="1.8"/>
        <rect x="14" y="5" width="4" height="14" rx="1.2" stroke="currentColor" stroke-width="1.8"/>
      </svg>
    </button>

    <!-- AR (derecha) -->
    <button id="arBtn" class="ar-fab hidden" type="button" aria-label="Ver en AR">
      <svg viewBox="0 0 24 24" fill="none"><path d="M12 3l8.66 5v8L12 21l-8.66-5V8L12 3zM12 3v18M3.34 8L12 13l8.66-5" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Ver en AR
    </button>
  </div>

  <!-- Overlay de carga AR -->
  <div id="arLoading" class="ar-loading hidden" aria-hidden="true">
    <div class="spinner" aria-hidden="true"></div>
    <span>Abriendo AR…</span>
  </div>

  <!-- Cartela -->
  <div id="infoSheet" class="info-sheet hidden" aria-hidden="true">
    <div class="info-sheet__drag"></div>
    <button id="infoClose" class="info-sheet__close" aria-label="Cerrar">✕</button>
    <div class="info-sheet__content">
      <h2 id="infoTitle">Obra</h2>
      <p class="info-meta" id="infoMeta"></p>
      <p class="info-desc" id="infoDesc"></p>
    </div>
  </div>

  <!-- Link AR iOS oculto -->
  <a id="iosARLink" rel="ar" style="display:none" aria-hidden="true"></a>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // ---------------- URL: soporta query *y* pathname limpias ----------------
      const qs = new URLSearchParams(location.search);
      let type   = (qs.get('type')   || '').toLowerCase();   // 'glb' | 'splat'
      let model  = (qs.get('model')  || '').toLowerCase();
      let figure = (qs.get('figure') || '').toLowerCase();

      if (!type) {
        const parts = location.pathname.split('/').filter(Boolean);
        if (parts[0] === 'splat' && parts[1]) {
          type = 'splat'; figure = parts[1];
        } else if (parts[0] === 'glb' && parts[1]) {
          type = 'glb'; model = parts[1];
        } else if (parts.length === 1) {
          type = 'glb'; model = parts[0]; // /:slug → GLB por defecto
        }
      }
      const slug = model || figure || '';

      // ---------------- Elementos del DOM ----------------
      const fabRow  = document.getElementById('fabRow');
      const mv      = document.getElementById('mv');
      const splat   = document.getElementById('splat');
      const skel    = document.getElementById('skel');
      const msg     = document.getElementById('msg');
      const arBtn   = document.getElementById('arBtn');
      const topBar  = document.getElementById('topBar');
      const pieceTitle = document.getElementById('pieceTitle');
      const infoBtn = document.getElementById('infoBtn');
      const sheet   = document.getElementById('infoSheet');
      const sheetClose = document.getElementById('infoClose');
      const infoTitle  = document.getElementById('infoTitle');
      const infoMeta   = document.getElementById('infoMeta');
      const infoDesc   = document.getElementById('infoDesc');
      const audioBtn   = document.getElementById('audioBtn');

      // ---------------- Rutas y helpers ----------------
      const glbUrl   = (name) => `/models/${name}/${name}.glb`;
      const usdzUrl  = (name) => `/models/${name}/${name}.usdz`;
      const splatUrl = (name) => `/splat/${name}/index.html`;

      async function exists(url){
        try{
          const r = await fetch(url, { method:'HEAD', cache:'force-cache', priority:'low', keepalive:true });
          return r.ok;
        }catch{
          return false;
        }
      }

      // Helpers de plataforma
      const isIOS     = /iPad|iPhone|iPod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      const isAndroid = /Android/.test(navigator.userAgent);

      // Helper para resetear listeners de un botón sin cambiar su HTML ni clases
      function resetClick(el){
        const clone = el.cloneNode(true);
        el.replaceWith(clone);
        return clone; // el nuevo nodo sin listeners
      }

      // Helpers de visibilidad
      function show(el){ if (el) el.classList.remove('hidden'); }
      function hide(el){ if (el) el.classList.add('hidden'); }

      // ---------------- Audio por figura ----------------
// ---------------- Audio por figura (botón siempre visible + cleanup) ----------------
let audio = null;
let audioCleanup = () => {};

async function setupAudioFor(id){
  // Limpia lo anterior
  try { audioCleanup(); } catch {}
  audioCleanup = () => {};
  audio = null;

  if (!audioBtn) return;

  const url = `/assets/audio/${id}.mp3`;

  // Mostrar SIEMPRE la fila y el botón (respetando tu CSS cuando se pueda)
  if (fabRow) { fabRow.classList.remove('hidden'); fabRow.style.display = 'flex'; }
  audioBtn.classList.remove('hidden', 'is-playing');
  audioBtn.style.display = 'flex';
  audioBtn.removeAttribute('disabled');
  audioBtn.dataset.state = 'idle'; // para estilos opcionales
  audioBtn.setAttribute('aria-pressed','false');
  audioBtn.setAttribute('aria-label','Reproducir audio');

  // Crea el elemento de audio
  audio = new Audio(url);
  audio.loop = true;
  audio.preload = 'none';

  const onClick = async () => {
    if (!audio) return;
    if (audio.paused) {
      try {
        await audio.play();
        audioBtn.classList.add('is-playing');
        audioBtn.dataset.state = 'playing';
        audioBtn.setAttribute('aria-pressed','true');
        audioBtn.setAttribute('aria-label','Pausar audio');
        if (navigator.vibrate) navigator.vibrate(10);
      } catch (e) {
        console.log('Bloqueo autoplay:', e);
      }
    } else {
      audio.pause();
      audioBtn.classList.remove('is-playing');
      audioBtn.dataset.state = 'idle';
      audioBtn.setAttribute('aria-pressed','false');
      audioBtn.setAttribute('aria-label','Reproducir audio');
    }
  };

  const onVisibility = () => {
    if (document.hidden && audio && !audio.paused) {
      audio.pause();
      audioBtn.classList.remove('is-playing');
      audioBtn.dataset.state = 'idle';
      audioBtn.setAttribute('aria-pressed','false');
      audioBtn.setAttribute('aria-label','Reproducir audio');
    }
  };

  const onError = () => {
    console.warn('Audio no encontrado o no reproducible:', url);
    // Mantenemos el botón visible, pero lo desactivamos para no confundir
    audioBtn.classList.remove('is-playing');
    audioBtn.dataset.state = 'error';
    audioBtn.setAttribute('aria-pressed','false');
    audioBtn.setAttribute('aria-label','Audio no disponible');
    audioBtn.setAttribute('disabled', 'true');
  };

  audioBtn.addEventListener('click', onClick);
  document.addEventListener('visibilitychange', onVisibility);
  audio.addEventListener('error', onError);

  // Cleanup para la siguiente figura
  audioCleanup = () => {
    try { if (audio) audio.pause(); } catch {}
    audio = null;
    audioBtn.removeEventListener('click', onClick);
    document.removeEventListener('visibilitychange', onVisibility);
    try { audio.removeEventListener('error', onError); } catch {}
  };
}

      // ---------------- AR helpers ----------------
      function openARFor(name){
        const usdz = usdzUrl(name);
        const glb  = glbUrl(name);
        const titleEl = document.getElementById('infoTitle');
        const arTitle = encodeURIComponent((titleEl?.textContent || name).trim());

        if (isIOS) { window.location.href = usdz; return; }
        if (isAndroid){
          const file = new URL(glb, location.origin).toString();
          const intent = `intent://arvr.google.com/scene-viewer/1.0?file=${encodeURIComponent(file)}&mode=ar_preferred&title=${arTitle}#Intent;scheme=https;package=com.google.android.googlequicksearchbox;action=android.intent.action.VIEW;end;`;
          window.location.href = intent;
        }
      }

      function openQuickLookSync(slug) {
        try {
          const link = document.getElementById('iosARLink');
          if (!link) return false;
          const ts = Date.now(); // cache-buster (cada click es "nuevo")
          link.setAttribute('href', `/models/${slug}/${slug}.usdz#${ts}`);
          link.click(); // síncrono, en la misma pila del gesto
          return true;
        } catch {
          return false;
        }
      }

      // Overlay “Abriendo AR…”
      function showARLoading(){
        const el = document.getElementById('arLoading');
        if (!el) return;
        el.classList.remove('hidden');
        requestAnimationFrame(()=> el.classList.add('visible'));
      }
      function hideARLoading(){
        const el = document.getElementById('arLoading');
        if (!el) return;
        el.classList.remove('visible');
        setTimeout(()=> el.classList.add('hidden'), 250);
      }
      document.addEventListener('visibilitychange', ()=>{
        if (!document.hidden) hideARLoading();
      });

      // ---------------- Info JSON ----------------
      async function loadInfoDataOrFallback(current){
        try{
          const res = await fetch('/assets/info.json', { cache:'no-store' });
          if (!res.ok) throw new Error('no info.json');
          const json = await res.json();
          return json || current;
        }catch{
          return current;
        }
      }

      // ---------------- Cartela ----------------
      function showHelp(){
        skel.classList.add('hidden');
        msg.classList.remove('hidden');
        msg.innerHTML = `
          <div>
            <b>Falta parámetro en la URL.</b><br/><br/>
            Usa ejemplos:<br/>
            <code>?type=glb&model=cristo-yacente</code><br/>
            <code>?type=splat&figure=calvo-anillo</code>
          </div>`;
      }

      let infoData = {
        "cristo-yacente":      { title:"Cristo Yacente", meta:"s. XVII · Autor/a desconocido/a", desc:"Descripción pendiente." },
        "virgen-romanica":     { title:"Virgen Románica", meta:"s. XII · Talla policromada", desc:"Descripción pendiente." },
        "san-jose-con-el-nino":{ title:"San José con el Niño", meta:"s. XVIII", desc:"Descripción pendiente." },
        "cristo-en-la-cruz":   { title:"Cristo en la Cruz", meta:"s. XVII", desc:"Descripción pendiente." }
      };

      // Cámara por figura
      const cameraSettings = {
        "cristo-yacente": {
          orbit: "0deg 74deg 10.6m",
          target: "0m 2m 0m",
          minRadius: "2.5m",
          maxRadius: "13.1m",
          minFov: "22deg",
          maxFov: "30deg"
        },
        "cristo-en-la-cruz": {
          orbit: "0deg 60deg 3.5m",
          target: "0m 1.8m 0m",
          minRadius: "2m",
          maxRadius: "5m",
          minFov: "22deg",
          maxFov: "45deg"
        },
        "san-jose-con-el-nino": {
          orbit: "0deg 65deg 3m",
          target: "0m 0.8m 0m",
          minRadius: "1.5m",
          maxRadius: "6m",
          minFov: "22deg",
          maxFov: "45deg"
        },
        "san-bernardo-con-la-virgen": {
          orbit: "0deg 65deg 3m",
          target: "0m 0.8m 0m",
          minRadius: "1.5m",
          maxRadius: "5m",
          minFov: "22deg",
          maxFov: "45deg"
        },
        "virgen-asuncion": {
          orbit: "0deg 60deg 2.8m",
          target: "0m 0.75m 0m",
          minRadius: "1.5m",
          maxRadius: "5m",
          minFov: "20deg",
          maxFov: "45deg"
        },
        "virgen-de-mena": {
          orbit: "0deg 60deg 3m",
          target: "0m 0.8m 0m",
          minRadius: "1.5m",
          maxRadius: "6m",
          minFov: "22deg",
          maxFov: "45deg"
        },
        "virgen-romanica": {
          orbit: "0deg 55deg 2.5m",
          target: "0m 0.35m 0m",
          minRadius: "1.2m",
          maxRadius: "5m",
          minFov: "20deg",
          maxFov: "45deg"
        },
        "ecce-homo": {
          orbit: "0deg 60deg 2.2m",
          target: "0m 0.4m 0m",
          minRadius: "1.0m",
          maxRadius: "4m",
          minFov: "20deg",
          maxFov: "45deg"
        },
        "reliquia-dorada": {
          orbit: "0deg 60deg 1.8m",
          target: "0m 0.25m 0m",
          minRadius: "0.8m",
          maxRadius: "3m",
          minFov: "20deg",
          maxFov: "45deg"
        },
        "bargueno-relicario": {
          orbit: "0deg 55deg 2.8m",
          target: "0m 0.4m 0m",
          minRadius: "1.2m",
          maxRadius: "5m",
          minFov: "20deg",
          maxFov: "45deg"
        },
        "tapiz": {
          orbit: "0deg 90deg 3m",
          target: "0m 1.2m 0m",
          minRadius: "2m",
          maxRadius: "6m",
          minFov: "25deg",
          maxFov: "45deg"
        },
        "casulla-santa-ana": {
          orbit: "0deg 85deg 2.5m",
          target: "0m 1.0m 0m",
          minRadius: "1.5m",
          maxRadius: "5m",
          minFov: "25deg",
          maxFov: "45deg"
        },
        "novisimos": {
          orbit: "0deg 60deg 2.8m",
          target: "0m 0.6m 0m",
          minRadius: "1.2m",
          maxRadius: "5m",
          minFov: "22deg",
          maxFov: "45deg"
        },
        "jesus-atado-a-la-columna": {
          orbit: "0deg 65deg 2.8m",
          target: "0m 0.8m 0m",
          minRadius: "1.2m",
          maxRadius: "5m",
          minFov: "22deg",
          maxFov: "45deg"
        }
      };

      window.cameraSettings = cameraSettings;

      function buildMeta(d){
        if (!d) return '';
        if (d.author || d.year || d.material) {
          const parts = [];
          if (d.year) parts.push(d.year);
          if (d.author) parts.push(d.author);
          if (d.material) parts.push(d.material);
          return parts.filter(Boolean).join(' · ');
        }
        return d.meta || '';
      }

      function renderInfo(s){
        const d = infoData[s] || {};
        const nice = (x) => (x||s||'').replace(/-/g,' ').trim();

        if (topBar && s){
          topBar.classList.remove('hidden');
          pieceTitle.textContent = d.title || nice(s);
        }
        infoTitle.textContent = d.title || nice(s);
        infoMeta.textContent  = buildMeta(d);

        const desc = d.desc || '';
        const extras = [];
        if (d.typology)   extras.push(`<div><strong>Tipología:</strong> ${d.typology}</div>`);
        if (d.material)   extras.push(`<div><strong>Material:</strong> ${d.material}</div>`);
        if (d.technique)  extras.push(`<div><strong>Técnica:</strong> ${d.technique}</div>`);
        if (d.dimensions) extras.push(`<div><strong>Dimensiones:</strong> ${d.dimensions}</div>`);
        if (d.year)       extras.push(`<div><strong>Fecha:</strong> ${d.year}</div>`);
        if (d.author)     extras.push(`<div><strong>Autor:</strong> ${d.author}</div>`);

        const extrasHtml = extras.length ? `<div class="info-extra">${extras.join('')}</div>` : '';
        infoDesc.innerHTML = [desc, extrasHtml].filter(Boolean).join('');

        // Actualizar <title> del documento
        try {
          const txt = (infoTitle?.textContent || s || 'Museo Virtual').trim();
          if (txt) document.title = `${txt} · Museo Virtual San Joaquín y Santa Ana`;
        } catch {}

      }

      // Panel/cartela UI
      function openSheet(){ renderInfo(slug); sheet.classList.remove('hidden'); sheet.setAttribute('aria-hidden','false'); }
      function closeSheet(){ sheet.classList.add('hidden'); sheet.setAttribute('aria-hidden','true'); }

      if (infoBtn) infoBtn.addEventListener('click', openSheet);
      sheetClose.addEventListener('click', closeSheet);
      sheet.addEventListener('click', (e)=>{ if (e.target === sheet) closeSheet(); });
      window.addEventListener('keydown', (e)=>{ if (e.key === 'Escape') closeSheet(); });

      // ---------------- Inicialización ----------------
      (async function init(){
        try{
          if (type === 'glb' && model){
            document.body.classList.remove('mode-splat');

            // Fuente GLB
            mv.src = glbUrl(model);

                        // === Indicador de progreso del modelo ===
            const progressEl = document.getElementById('loaderProgress');
            if (mv) {
              mv.addEventListener('progress', (e) => {
                const ratio = Math.round(e.detail.totalProgress * 100);
                if (progressEl) progressEl.textContent = `${ratio}%`;
              });
              mv.addEventListener('load', () => {
                // desvanecer la pantalla de carga suavemente
                const skel = document.getElementById('skel');
                if (skel) {
                  skel.style.opacity = '0';
                  setTimeout(() => skel.classList.add('hidden'), 600);
                }
              });
            }


            // Poster por pieza con fallback
            try {
              const posterSrc = `/assets/posters/${model}.webp`;
              if (await exists(posterSrc)) {
                mv.poster = posterSrc;
                mv.setAttribute('poster', posterSrc);
              } else {
                mv.poster = '/models/placeholder.webp';
                mv.setAttribute('poster','/models/placeholder.webp');
              }
            } catch {
              mv.poster = '/models/placeholder.webp';
              mv.setAttribute('poster','/models/placeholder.webp');
            }

            // Config cámara
            const cam = cameraSettings[model];
            if (cam) {
              if (cam.orbit) mv.cameraOrbit = cam.orbit;
              if (cam.target) mv.cameraTarget = cam.target;
              if (cam.minRadius) mv.minCameraOrbit = `auto auto ${cam.minRadius}`;
              if (cam.maxRadius) mv.maxCameraOrbit = `auto auto ${cam.maxRadius}`;
              if (cam.minFov) mv.minFieldOfView = cam.minFov;
              if (cam.maxFov) mv.maxFieldOfView = cam.maxFov;
            }

            // HDR suave
            try {
              await fetch('/assets/hdr/museo-suave.hdr', { cache: 'force-cache' }).catch(()=>{});
              mv.environmentImage = '/assets/hdr/museo-suave.hdr';
              mv.exposure = '2';
              mv.shadowIntensity = '0.7';
              mv.shadowSoftness = '1.0';
              mv.environmentRotation = '10deg';
              mv.skyboxImage = '/assets/hdr/museo-suave-blur.webp';
              mv.backgroundColor = '#0f1115';
            } catch (e) {
              console.warn('No se pudo aplicar el HDR, usando neutral', e);
            }

            // Iluminación por pieza (opcional)
            const lightSettings = {
              "cristo-yacente": { exposure: 1.6, shadowIntensity: 0.9, shadowSoftness: 0.9, environmentRotation: "15deg" },
              "virgen-romanica": { exposure: 1.3, environmentRotation: "0deg" }
            };
            const L = lightSettings[model];
            if (L){
              if (L.exposure != null) mv.exposure = String(L.exposure);
              if (L.shadowIntensity != null) mv.shadowIntensity = String(L.shadowIntensity);
              if (L.shadowSoftness != null) mv.shadowSoftness = String(L.shadowSoftness);
              if (L.environmentRotation) mv.environmentRotation = L.environmentRotation;
            }

            // iOS Quick Look
            mv.iosSrc = usdzUrl(model);
            mv.classList.remove('hidden');

            // Oculta botón AR nativo
            if (!mv.querySelector('[slot="ar-button"]')) {
              const blocker = document.createElement('button');
              blocker.setAttribute('slot','ar-button');
              blocker.setAttribute('aria-hidden','true');
              blocker.style.display = 'none';
              blocker.tabIndex = -1;
              mv.appendChild(blocker);
            }

           // ✅ Botón AR unificado (optimizado y reseteado por carga)
if (arBtn) {
  // Elimina handlers previos si la página fue recargada desde memoria
  arBtn.replaceWith(arBtn.cloneNode(true));
  const newArBtn = document.getElementById('arBtn');

  newArBtn.classList.remove('hidden');
  newArBtn.addEventListener('click', async () => {
    showARLoading();

    try {
      if (isIOS) {
        const ok = openQuickLookSync(model);
        if (!ok) window.location.href = usdzUrl(model);
        return;
      }

      if (isAndroid) {
        const a = document.createElement('a');
        const intent = `intent://arvr.google.com/scene-viewer/1.0?file=${encodeURIComponent(glbUrl(model))}&mode=ar_preferred&title=${encodeURIComponent(model)}#Intent;scheme=https;package=com.google.android.googlequicksearchbox;action=android.intent.action.VIEW;end;`;
        a.href = intent;
        a.style.display = 'none';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        return;
      }

      if (mv?.activateAR) await mv.activateAR();
      else openARFor(model);
    } catch (err) {
      console.error('Error abriendo AR:', err);
      openARFor(model);
    } finally {
      hideARLoading();
    }
  });
}



            if (slug) {
              infoData = await loadInfoDataOrFallback(infoData);
              renderInfo(slug);
            }

            setupAudioFor(model);
            skel.classList.add('hidden');
            return;
          }

          if (type === 'splat' && figure){
            document.body.classList.add('mode-splat');

            // --- Poster previo al SPLAT (aparece ya, antes del src) ---
            const splatPoster = document.getElementById('splatPoster');
            if (splatPoster) {
              // Fallback inmediato
              splatPoster.style.backgroundImage = `url('/models/placeholder.webp')`;
              splatPoster.classList.remove('hidden');
              requestAnimationFrame(()=> splatPoster.classList.add('visible'));

              // Intentar poster específico en paralelo
              (async ()=>{
                try{
                  const posterUrl = `/assets/posters/${figure}.webp`;
                  const r = await fetch(posterUrl, { method:'HEAD', cache:'force-cache' });
                  if (r.ok) splatPoster.style.backgroundImage = `url('${posterUrl}')`;
                }catch{}
              })();

              // Ocultar cuando el SPLAT carga
              splat.addEventListener('load', ()=>{
                splatPoster.classList.add('fade-out');
                setTimeout(()=> splatPoster.classList.add('hidden'), 700);
              }, { once:true });
            }

            // Cargar SPLAT
            splat.src = splatUrl(figure);
            splat.classList.remove('hidden');

            // FAB AR
            arBtn.classList.remove('hidden');
            arBtn.onclick = () => {
              showARLoading();
              if (isIOS) {
                const ok = openQuickLookSync(figure);
                if (!ok) window.location.href = usdzUrl(figure); // fallback duro
                return;
              }
              openARFor(figure);
            };

            if (slug) {
              infoData = await loadInfoDataOrFallback(infoData);
              renderInfo(slug);
            }

            setupAudioFor(figure);
            skel.classList.add('hidden');
            return;
          }

          // Sin parámetros válidos:
          showHelp();

        } catch(err){
          console.error(err);
          msg.classList.remove('hidden');
          msg.innerHTML = `<b>Error:</b> ${String(err).replace(/</g,'&lt;')}`;
          skel.classList.add('hidden');
        }
      })();
    });

    /* === PANEL VISUAL DE AJUSTE DE CÁMARA (con min/max zoom) === */
    (function setupCameraDebugPanel() {
      if (!location.search.includes('debug=true')) return;

      const qs = new URLSearchParams(location.search);
      let dbgModel = (qs.get('model') || qs.get('figure') || '').toLowerCase();
      if (!dbgModel) {
        const p = location.pathname.split('/').filter(Boolean);
        if (p[0] === 'splat' && p[1]) dbgModel = p[1];
        else if (p[0] === 'glb' && p[1]) dbgModel = p[1];
        else if (p.length === 1) dbgModel = p[0];
      }
      const model = dbgModel;

      const mv = document.getElementById('mv');
      if (!mv) return;

      const num = (s, def=0) => {
        if (s == null) return def;
        const m = String(s).match(/-?\d+(\.\d+)?/);
        return m ? parseFloat(m[0]) : def;
      };

      const cam = (window.cameraSettings && window.cameraSettings[model]) || {};
      const initPhi = num((cam.orbit||'0deg 70deg 3m').split(' ')[1], 70);
      const initR   = num((cam.orbit||'0deg 70deg 3m').split(' ')[2], 3);
      const initY   = num((cam.target||'0m 0.5m 0m').split(' ')[1], 0.5);
      const initMinR = num(cam.minRadius, Math.max(0.4, initR*0.4));
      const initMaxR = num(cam.maxRadius, Math.max(initR*1.5, initMinR+0.5));
      const initFov  = num(cam.fov || (mv.fieldOfView||'30deg'), 30);

      const panel = document.createElement('div');
      panel.id = 'camDebug';
      panel.style.cssText = `
        position: fixed; top: 10px; right: 10px; width: 260px;
        background: rgba(15,17,21,0.95); color: #e9eef7; font: 13px/1.2 system-ui,sans-serif;
        border-radius: 12px; padding: 12px; z-index: 9999; box-shadow: 0 0 15px rgba(0,0,0,.4); backdrop-filter: blur(8px);
      `;
      panel.innerHTML = `
        <b>🎥 Ajuste de Cámara</b><br><br>

        <label>Altura (target Y): <span id="valY">${initY.toFixed(2)}</span> m</label><br>
        <input id="ctrlY" type="range" min="-1" max="3" step="0.05" value="${initY}"><br><br>

        <label>Distancia inicial (radius): <span id="valR">${initR.toFixed(1)}</span> m</label><br>
        <input id="ctrlR" type="range" min="0.5" max="30" step="0.1" value="${initR}"><br><br>

        <label>Elevación (phi): <span id="valPhi">${initPhi.toFixed(0)}</span>°</label><br>
        <input id="ctrlPhi" type="range" min="0" max="90" step="1" value="${initPhi}"><br><br>

        <label>FOV (zoom óptico): <span id="valFov">${initFov.toFixed(0)}</span>°</label><br>
        <input id="ctrlFov" type="range" min="15" max="75" step="1" value="${initFov}"><br><br>

        <hr style="border-color:#2a2f38; opacity:.4; margin:8px 0">

        <label>Zoom mínimo (minRadius): <span id="valMinR">${initMinR.toFixed(1)}</span> m</label><br>
        <input id="ctrlMinR" type="range" min="0.4" max="60" step="0.1" value="${initMinR}"><br><br>

        <label>Zoom máximo (maxRadius): <span id="valMaxR">${initMaxR.toFixed(1)}</span> m</label><br>
        <input id="ctrlMaxR" type="range" min="0.5" max="80" step="0.1" value="${initMaxR}"><br><br>

        <button id="copyCam" style="width:100%; padding:8px; border:none; background:#40cbcb; color:#fff; font-weight:700; border-radius:8px; cursor:pointer;">
          📋 Copiar valores
        </button>
      `;
      document.body.appendChild(panel);

      const yRange   = panel.querySelector('#ctrlY');
      const rRange   = panel.querySelector('#ctrlR');
      const phiRange = panel.querySelector('#ctrlPhi');
      const fovRange = panel.querySelector('#ctrlFov');
      const minRRange= panel.querySelector('#ctrlMinR');
      const maxRRange= panel.querySelector('#ctrlMaxR');

      const valY   = panel.querySelector('#valY');
      const valR   = panel.querySelector('#valR');
      const valPhi = panel.querySelector('#valPhi');
      const valFov = panel.querySelector('#valFov');
      const valMinR= panel.querySelector('#valMinR');
      const valMaxR= panel.querySelector('#valMaxR');

      function clampLimits() {
        let minR = parseFloat(minRRange.value);
        let r    = parseFloat(rRange.value);
        let maxR = parseFloat(maxRRange.value);

        if (minR > maxR - 0.1) minR = maxR - 0.1;
        if (r < minR) r = minR;
        if (r > maxR) r = maxR;

        minRRange.value = minR.toFixed(1);
        rRange.value    = r.toFixed(1);
        maxRRange.value = maxR.toFixed(1);

        valMinR.textContent = minR.toFixed(1);
        valR.textContent    = r.toFixed(1);
        valMaxR.textContent = maxR.toFixed(1);
        return { minR, r, maxR };
      }

      function updateCamera() {
        const y   = parseFloat(yRange.value);
        const phi = parseFloat(phiRange.value);
        const fov = parseFloat(fovRange.value);
        const { minR, r, maxR } = clampLimits();

        valY.textContent   = y.toFixed(2);
        valPhi.textContent = phi.toFixed(0);
        valFov.textContent = fov.toFixed(0);

        mv.minCameraOrbit = `auto auto ${minR}m`;
        mv.maxCameraOrbit = `auto auto ${maxR}m`;
        mv.cameraTarget = `0m ${y}m 0m`;
        mv.cameraOrbit  = `0deg ${phi}deg ${r}m`;
        mv.fieldOfView  = `${fov}deg`;
        mv.jumpCameraToGoal();
      }

      [yRange, rRange, phiRange, fovRange, minRRange, maxRRange]
        .forEach(i => i.addEventListener('input', updateCamera));

      updateCamera();

      panel.querySelector('#copyCam').onclick = () => {
        const text = `
"${model || 'cristo-yacente'}": {
  orbit: "0deg ${phiRange.value}deg ${rRange.value}m",
  target: "0m ${yRange.value}m 0m",
  minRadius: "${minRRange.value}m",
  maxRadius: "${maxRRange.value}m",
  minFov: "22deg",
  maxFov: "${fovRange.value}deg"
},`.trim();
        navigator.clipboard.writeText(text);
        const btn = panel.querySelector('#copyCam');
        btn.textContent = "✅ Copiado";
        setTimeout(()=> btn.textContent = "📋 Copiar valores", 1200);
      };
    })();

/* === Interacción táctil para arrastrar la cartela (UX mejorado + fix reopen) === */
(function enableInfoSheetDrag() {
  const sheet = document.getElementById('infoSheet');
  const infoBtn = document.getElementById('infoBtn');
  if (!sheet || !infoBtn) return;

  let startY = 0;
  let currentY = 0;
  let isDragging = false;
  const threshold = 90; // píxeles de arrastre necesarios para cerrar

  const onStart = (e) => {
    if (e.touches?.length !== 1) return;
    startY = e.touches[0].clientY;
    isDragging = true;
    sheet.style.transition = 'none';
  };

  const onMove = (e) => {
    if (!isDragging || e.touches?.length !== 1) return;
    currentY = e.touches[0].clientY - startY;
    if (currentY > 0) {
      sheet.style.transform = `translateY(${currentY}px)`;
      sheet.style.opacity = `${1 - Math.min(currentY / 250, 0.4)}`;
    }
  };

  const closeSheetSmooth = () => {
    sheet.style.transition = 'transform .28s ease, opacity .28s ease';
    sheet.style.transform = 'translateY(100%)';
    sheet.style.opacity = '0';
    // pequeño retraso para permitir la animación antes del hidden
    setTimeout(() => {
      sheet.classList.add('hidden');
      sheet.setAttribute('aria-hidden','true');
      sheet.style.transform = '';
      sheet.style.opacity = '';
    }, 280);
  };

  const onEnd = () => {
    if (!isDragging) return;
    sheet.style.transition = 'transform .28s ease, opacity .28s ease';
    if (currentY > threshold) {
      closeSheetSmooth();
    } else {
      sheet.style.transform = 'translateY(0)';
      sheet.style.opacity = '1';
    }
    isDragging = false;
    startY = 0;
    currentY = 0;
  };

  // Escuchar gestos táctiles
  sheet.addEventListener('touchstart', onStart, { passive: true });
  sheet.addEventListener('touchmove', onMove, { passive: true });
  sheet.addEventListener('touchend', onEnd);

  // Reapertura desde el botón de info
  infoBtn.addEventListener('click', () => {
    sheet.classList.remove('hidden');
    sheet.setAttribute('aria-hidden','false');
    sheet.style.transform = 'translateY(0)';
    sheet.style.opacity = '1';
  });
})();

/* 🔒 Bloquear page-zoom del navegador solo cuando el gesto ocurre sobre la UI */
(function preventPageZoomOnUI(){
  const uiRoots = ['#topBar', '#infoSheet', '#fabRow'];

  const isInUI = (target) => {
    if (!target || !target.closest) return false;
    return uiRoots.some(sel => target.closest(sel));
  };

  /* iOS: gesturestart/gesturechange → pinch page-zoom */
  const onGesture = (e) => {
    if (isInUI(e.target)) {
      e.preventDefault();  // requiere passive:false
    }
  };
  document.addEventListener('gesturestart', onGesture, { passive:false, capture:true });
  document.addEventListener('gesturechange', onGesture, { passive:false, capture:true });

  /* Trackpad pinch (Ctrl+wheel) en Desktop → evita zoom si es sobre UI */
  window.addEventListener('wheel', (e) => {
    if (e.ctrlKey && isInUI(e.target)) {
      e.preventDefault();
    }
  }, { passive:false, capture:true });

  /* Evitar double-tap zoom en iOS SOLO en UI */
  let lastTouchEnd = 0;
  const onTouchEnd = (e) => {
    if (!isInUI(e.target)) return;
    const now = Date.now();
    if (now - lastTouchEnd < 350) {
      e.preventDefault(); // suprime double-tap zoom
    }
    lastTouchEnd = now;
  };
  document.addEventListener('touchend', onTouchEnd, { passive:false, capture:true });

  /* Extra: evita scroll-bounce que a veces dispara zoom accidental en UI */
  const onTouchMove = (e) => {
    if (isInUI(e.target)) {
      // permitimos desplazamiento en la cartela, pero no “pinch zoom” de página
      if (e.scale && e.scale !== 1) e.preventDefault();
    }
  };
  document.addEventListener('touchmove', onTouchMove, { passive:false, capture:true });
})();
