<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover" />
  <title>Visor Universal 3D + AR</title>

  <link rel="stylesheet" href="./index.css">
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>

  <style>
    :root{
      --bg:#0f1115;
      --text:#e9eef7;
      --muted:#9aa4b2;
      --brand:#40cbcb;
      --shadow:0 10px 30px rgba(0,0,0,.35);
    }
    html,body{margin:0;height:100%;background:var(--bg);color:var(--text);overflow:hidden}
    .hidden{display:none!important}

    /* Vista */
    model-viewer, iframe#splat { width:100vw; height:100dvh; display:block; background:var(--bg) }
    iframe#splat{ border:0 }

    /* Mensaje de error/ayuda */
    #msg{ position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
      font:500 16px/1.4 system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; text-align:center; color:var(--muted); padding:24px }
    #msg b{ color:#ff6464 }

    /* Skeleton */
    .skeleton{ position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
      background:linear-gradient(160deg,#101319 0%,#0b0e13 100%); color:#7b8696; font:500 14px system-ui, -apple-system, Segoe UI, Roboto, Arial }
    .spinner{ width:28px; height:28px; border-radius:50%; border:3px solid rgba(255,255,255,.15); border-top-color:#fff; animation:rot .9s linear infinite; margin-right:10px }
    @keyframes rot{ to{ transform:rotate(360deg) } }

    /* FAB AR: ahora a la IZQUIERDA, solo móvil/tablet */
    .ar-fab{
      position:fixed; left:calc(16px + env(safe-area-inset-left)); bottom:calc(16px + env(safe-area-inset-bottom));
      display:none; gap:10px; align-items:center; justify-content:center;
      height:56px; padding:0 18px; min-width:160px;
      border:none; border-radius:100px; cursor:pointer;
      background:var(--brand); color:white; font-weight:700; font-size:16px; letter-spacing:.2px;
      box-shadow:var(--shadow); z-index:20;
    }
    .ar-fab svg{ width:22px; height:22px }
    .ar-fab:active{ transform:translateY(1px) }
    @media (max-width:1024px){ .ar-fab{ display:flex } }

    /* Botón de Audio (toggle) a la DERECHA, solo móvil/tablet */
    #audio-toggle{
      position:fixed; right:calc(16px + env(safe-area-inset-right)); bottom:calc(16px + env(safe-area-inset-bottom));
      display:none; align-items:center; gap:8px;
      padding:10px 14px; border-radius:999px; border:none; cursor:pointer;
      background:#1f2733; color:#fff; font:600 14px/1 system-ui, -apple-system, Segoe UI, Roboto, Arial;
      box-shadow:var(--shadow); z-index:30;
    }
    #audio-toggle svg{ width:18px; height:18px }
    @media (max-width:1024px){ #audio-toggle{ display:flex } }
    @media (min-width:1025px){ #audio-toggle{ display:none!important } }

    /* Audio oculto */
    #global-audio{ display:none }
  </style>
</head>
<body>

  <div id="msg" class="hidden"></div>
  <div id="skel" class="skeleton"><div class="spinner"></div>Cargando…</div>

  <!-- GLB -->
  <model-viewer id="mv" class="hidden"
    alt="Modelo 3D"
    camera-controls touch-action="pan-y"
    ar ar-modes="webxr scene-viewer quick-look"
    environment-image="neutral"
    shadow-intensity="1.2" shadow-softness="0.9"
    exposure="1"
    camera-orbit="0deg 70deg 1.5m"
    min-camera-orbit="auto auto 0.4m"
    max-camera-orbit="auto auto 6m"
    field-of-view="30deg">
  </model-viewer>

  <!-- SPLAT -->
  <iframe id="splat" class="hidden" allow="xr; xr-spatial-tracking; gyroscope; accelerometer"></iframe>

  <!-- FAB AR (izquierda) -->
  <button id="arBtn" class="ar-fab hidden" type="button" aria-label="Ver en AR">
    <svg viewBox="0 0 24 24" fill="none"><path d="M12 3l8.66 5v8L12 21l-8.66-5V8L12 3zM12 3
