<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Apolo 3D Viewer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <style>
    :root { color-scheme: dark; }
    html, body {
      margin: 0;
      height: 100%;
      background: #0f1115;
      overflow: hidden;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    }
    #viewer-container { position: fixed; inset: 0; width: 100vw; height: 100vh; }
    model-viewer, iframe { width: 100%; height: 100%; display: block; border: none; }

    /* FAB AR SIEMPRE VISIBLE */
    #ar-fab {
      position: fixed;
      right: 16px;
      bottom: calc(16px + env(safe-area-inset-bottom));
      width: 56px; height: 56px; border-radius: 50%;
      border: 0; background: #40cbcb; color: #fff;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 12px 30px rgba(0,0,0,.35);
      z-index: 2000;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      cursor: pointer;
    }
    #ar-fab:active { transform: scale(.96); }
    #ar-fab svg { width: 24px; height: 24px; display:block; }

    /* En pantallas grandes puedes querer pastilla centrada. Descomenta si lo prefieres:
    @media (min-width: 768px){
      #ar-fab {
        left: 50%; right: auto; transform: translateX(-50%);
        width: auto; height: auto; padding: 12px 16px; border-radius: 12px;
        gap: 10px;
      }
      #ar-fab .label { display: inline; font-weight: 600; }
    }
    */

    #message {
      position: absolute; inset: 0; display: grid; place-items: center;
      color: white; text-align: center; padding: 24px; white-space: pre-line;
    }
  </style>
</head>
<body>

<div id="viewer-container">
  <div id="message">Cargando visor...</div>
</div>

<!-- Botón AR global (siempre visible) -->
<button id="ar-fab" aria-label="Abrir en Realidad Aumentada" title="AR">
  <svg viewBox="0 0 24 24" aria-hidden="true">
    <path fill="currentColor" d="M3 7.5L12 3l9 4.5v9L12 21l-9-4.5v-9Zm9 1.8L6.6 7.5 12 4.8l5.4 2.7L12 9.3Zm-1 9.42v-6.3L5 8.85v6.3l6 3.57Zm2 0 6-3.57v-6.3l-6 3.57v6.3Z"/>
  </svg>
  <!-- <span class="label">Ver en AR</span> -->
</button>

<script>
  const qs = new URLSearchParams(location.search);
  const type   = (qs.get("type") || "").toLowerCase();   // 'glb' | 'splat'
  const model  = qs.get("model");                         // p.ej. 'cristo'
  const figure = qs.get("figure");                        // p.ej. 'calvo-anillo'

  const container = document.getElementById("viewer-container");
  const message   = document.getElementById("message");
  const arFab     = document.getElementById("ar-fab");

  // Detección simple
  const UA       = navigator.userAgent;
  const isIOS    = /iPhone|iPad|iPod/i.test(UA);
  const isAndroid= /Android/i.test(UA);
  const isCriOS  = /CriOS/i.test(UA);       // Chrome iOS
  const isFxiOS  = /FxiOS/i.test(UA);       // Firefox iOS
  const isSafari = isIOS && !isCriOS && !isFxiOS;
  const isChrome = /Chrome\/\d+/i.test(UA);

  function showError(msg) {
    container.innerHTML = `<div id='message'>${msg}</div>`;
  }

  // Guardamos referencia a <model-viewer> si existe (para activateAR)
  let mvRef = null;
  // Nombre base del modelo para AR (usamos 'model' si glb; si splat usamos 'figure')
  let arName = null;

  if (type === "glb" && model) {
    arName = model;
    renderGLB(model);
  }
  else if (type === "splat" && figure) {
    arName = figure; // asumimos que hay un .glb/.usdz paralelo para AR
    renderSplat(figure);
  }
  else {
    showError("❌ Falta parámetro en la URL.\n\nUsa ejemplos:\n?type=glb&model=cristo\n?type=splat&figure=calvo-anillo");
  }

  async function renderGLB(name) {
    await import("https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js");

    const mv = document.createElement("model-viewer");
    mv.setAttribute("src", `/models/${name}/${name}.glb`);
    mv.setAttribute("ios-src", `/models/${name}/${name}.usdz`);
    mv.setAttribute("ar", "");
    mv.setAttribute("ar-modes", "webxr scene-viewer quick-look");
    mv.setAttribute("camera-controls", "");
    mv.setAttribute("shadow-intensity", "1.5");
    mv.setAttribute("shadow-softness", "1");
    mv.setAttribute("exposure", "1");
    mv.setAttribute("environment-image", "neutral");
    mv.setAttribute("touch-action", "pan-y");
    mv.setAttribute("alt", `Modelo 3D de ${name}`);

    // (Opcional) dejar el slot interno por si quieres también:
    // const btn = document.createElement("button");
    // btn.slot = "ar-button";
    // btn.textContent = "Ver en AR";
    // mv.appendChild(btn);

    mvRef = mv; // guardamos referencia para activateAR

    container.replaceChildren(mv);
  }

  function renderSplat(fig) {
    const iframe = document.createElement("iframe");
    iframe.src =
      `/splat/viewer/?content=/splat/${fig}/scene.compressed.ply` +
      `&settings=/splat/${fig}/settings.json`;
    iframe.allow = "xr; fullscreen; autoplay";
    container.replaceChildren(iframe);
  }

  // --- LÓGICA DEL BOTÓN AR SIEMPRE VISIBLE ---
  arFab.addEventListener('click', () => {
    // Si tenemos <model-viewer> y expone activateAR, úsalo primero (mejor UX)
    if (mvRef && typeof mvRef.activateAR === 'function') {
      try {
        mvRef.activateAR();
        return; // si funciona, no seguimos
      } catch (e) {
        // seguimos al fallback
      }
    }

    // Fallback absoluto por plataforma: abre directamente los assets AR
    const base = location.origin;
    if (!arName) {
      alert('No se ha indicado un modelo para AR.');
      return;
    }

    const usdz = `${base}/models/${arName}/${arName}.usdz`;
    const glb  = `${base}/models/${arName}/${arName}.glb`;

    if (isIOS) {
      // iOS: Quick Look con USDZ (funciona desde Safari y la mayoría de webviews)
      window.location.href = usdz;
      return;
    }

    if (isAndroid) {
      // Android: Scene Viewer (Chrome seguro, otros pueden redirigir a app de Google)
      // Enlace https (mejor compatibilidad que intent:// en muchos casos)
      const sceneViewerUrl =
        `https://arvr.google.com/scene-viewer/1.0?file=${encodeURIComponent(glb)}&mode=ar_preferred&title=${encodeURIComponent(arName)}`;
      window.location.href = sceneViewerUrl;
      return;
    }

    // Desktop u otros: no hay AR real; si quieres, descarga el GLB o muestra aviso
    alert('AR no está disponible en este dispositivo. Abriendo el modelo 3D.');
    // window.location.href = glb; // opcional
  });
</script>

</body>
</html>
