<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0f1115">
  <title>Museo Virtual San Joaquín y Santa Ana</title>

  <!-- Tipografía -->
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">

  <!-- CSS -->
  <link rel="preload" href="/index.css" as="style" fetchpriority="high">
  <link rel="stylesheet" href="/index.css">

  <!-- model-viewer -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js" defer></script>
</head>

<body>
  <!-- Topbar -->
  <header id="topBar" class="hidden">
    <h1 id="pieceTitle"></h1>
    <button id="infoBtn" class="info-btn" type="button" aria-label="Mostrar información">Información</button>
  </header>

  <!-- Mensaje / errores -->
  <div id="msg" class="hidden"></div>

  <!-- Skeleton -->
  <div id="skel" class="skeleton"><div class="spinner"></div>Cargando…</div>

  <!-- Visor GLB -->
  <model-viewer id="mv" class="hidden"
    poster="/assets/posters/placeholder.webp"
    alt="Modelo 3D"
    camera-controls
    touch-action="pan-y"
    ar
    ar-modes="scene-viewer quick-look webxr"
    ar-scale="fixed"
    ar-placement="floor"
    environment-image="neutral"
    shadow-intensity="1"
    exposure="1.2">
  </model-viewer>

  <!-- SPLAT -->
  <iframe id="splat" class="hidden" loading="lazy"
    allow="autoplay; fullscreen; xr-spatial-tracking; camera; microphone; gyroscope; accelerometer"></iframe>

  <!-- Poster SPLAT -->
  <div id="splatPoster" class="splat-poster hidden" aria-hidden="true"></div>

  <!-- FABs (se quedan, aunque no los usemos aún) -->
  <div id="fabRow" class="fab-row">
    <button id="audioBtn" class="audio-fab hidden" type="button" aria-pressed="false" aria-label="Reproducir audio">
      <svg class="icon-play" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M4 9v6h3l5 4V5L7 9H4z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M15 10.5a3.5 3.5 0 010 3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        <path d="M17.5 8a6 6 0 010 8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
      <svg class="icon-pause" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <rect x="6" y="5" width="4" height="14" rx="1.2" stroke="currentColor" stroke-width="1.8"/>
        <rect x="14" y="5" width="4" height="14" rx="1.2" stroke="currentColor" stroke-width="1.8"/>
      </svg>
    </button>

    <button id="arBtn" class="ar-fab hidden" type="button" aria-label="Ver en AR">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M12 3l8.66 5v8L12 21l-8.66-5V8L12 3zM12 3v18M3.34 8L12 13l8.66-5" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Ver en AR
    </button>
  </div>

  <!-- Cartela -->
  <div id="infoSheet" class="info-sheet hidden" aria-hidden="true">
    <div class="info-sheet__drag"></div>
    <button id="infoClose" class="info-sheet__close" aria-label="Cerrar">✕</button>
    <div class="info-sheet__content">
      <h2 id="infoTitle">Obra</h2>
      <p class="info-meta" id="infoMeta"></p>
      <p class="info-desc" id="infoDesc"></p>
    </div>
  </div>

  <script>
  document.addEventListener('DOMContentLoaded', () => {
    // ---------- Utilidades ----------
    const $ = id => document.getElementById(id);
    const mv = $('mv'), splat = $('splat'), skel = $('skel'), msg = $('msg');
    const topBar = $('topBar'), pieceTitle = $('pieceTitle'), infoBtn = $('infoBtn');
    const infoSheet = $('infoSheet'), infoClose = $('infoClose');
    const infoTitle = $('infoTitle'), infoMeta = $('infoMeta'), infoDesc = $('infoDesc');
    const splatPoster = $('splatPoster');

    function show(el){ el && el.classList.remove('hidden'); }
    function hide(el){ el && el.classList.add('hidden'); }
    function setError(text){
      msg.innerHTML = text;
      show(msg); hide(skel); hide(mv); hide(splat);
    }

    // ---------- Detección de ruta ----------
    const qs = new URLSearchParams(location.search);
    let type = (qs.get('type') || '').toLowerCase();
    let model = (qs.get('model') || '').toLowerCase();
    let figure = (qs.get('figure') || '').toLowerCase();

    if (!type) {
      const parts = location.pathname.split('/').filter(Boolean);
      if (parts[0] === 'splat' && parts[1]) { type = 'splat'; figure = parts[1]; }
      else if (parts.length === 1) { type = 'glb'; model = parts[0]; }
    }
    const slug = model || figure || '';

    // ---------- Cartela ----------
    function renderInfo(slug){
      // Datos mínimos (se puede conectar a info.json después)
      const fallbackTitle = slug ? slug.replace(/-/g,' ') : 'Obra';
      infoTitle.textContent = fallbackTitle;
      pieceTitle.textContent = fallbackTitle;
      infoMeta.textContent = '';
      infoDesc.textContent = '';
      show(topBar);
    }
    infoBtn.onclick = () => { renderInfo(slug); show(infoSheet); infoSheet.setAttribute('aria-hidden','false'); };
    infoClose.onclick = () => { hide(infoSheet); infoSheet.setAttribute('aria-hidden','true'); };
    infoSheet.addEventListener('click', (e)=>{ if (e.target === infoSheet) infoClose.click(); });

    // ---------- Carga GLB ----------
    function loadGLB(name){
      // src y poster (no usamos HEAD para evitar problemas de servidores que no soportan HEAD)
      mv.src = `/models/${name}/${name}.glb`;
      mv.poster = `/assets/posters/${name}.webp`;

      // eventos de carga/errores
      mv.addEventListener('load', () => { hide(skel); show(mv); }, { once:true });
      mv.addEventListener('error', () => {
        console.warn('Fallo al cargar GLB o póster, probando placeholder.');
        mv.poster = '/assets/posters/placeholder.webp';
        show(mv);
        hide(skel);
      }, { once:true });

      renderInfo(name);
      // si por lo que sea no dispara 'load' (GLB roto), a los 3s mostramos igualmente
      setTimeout(()=>{ if (!mv || mv.classList.contains('hidden')) { show(mv); hide(skel); }}, 3000);
    }

    // ---------- Carga SPLAT ----------
    function loadSPLAT(name){
      // Poster de espera
      splatPoster.style.backgroundImage = "url('/assets/posters/placeholder.webp')";
      show(splatPoster);
      requestAnimationFrame(()=> splatPoster.classList.add('visible'));

      // Intento de póster específico (sin HEAD; si 404, el navegador lo gestiona solo)
      const img = new Image();
      img.onload = () => { splatPoster.style.backgroundImage = `url('/assets/posters/${name}.webp')`; };
      img.src = `/assets/posters/${name}.webp`;

      // Carga del visor SPLAT (iframe)
      splat.onload = () => {
        hide(skel);
        show(splat);
        splatPoster.classList.add('fade-out');
        setTimeout(()=> hide(splatPoster), 600);
      };
      splat.onerror = () => {
        setError(`<b>No se pudo cargar el SPLAT:</b> /splat/${name}/index.html`);
      };
      splat.src = `/splat/${name}/index.html`;

      renderInfo(name);
      // safety: si no llamara onload
      setTimeout(()=>{ if (splat.classList.contains('hidden')) { show(splat); hide(skel); }}, 4000);
    }

    // ---------- Inicio ----------
    try{
      if (type === 'glb' && model){
        document.body.classList.remove('mode-splat');
        loadGLB(model);
      } else if (type === 'splat' && figure){
        document.body.classList.add('mode-splat');
        loadSPLAT(figure);
      } else {
        setError(`<b>Ruta/URL inválida.</b><br>Ejemplos:<br>/cristo-yacente<br>/splat/calvo-anillo`);
      }
    }catch(err){
      console.error(err);
      setError('Error inesperado al inicializar el visor.');
    }
  });
  </script>
</body>
</html>
